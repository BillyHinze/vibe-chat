<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VIBE ✦ next-gen chat</title>
<meta name="theme-color" content="#0a0a0f"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════
   VIBE v2 — Vertical Card Layout
   Aesthetic: Gen-Z neon chrome meets brutalist snap UI
   NO Discord. Think Snapchat meets Cyberpunk.
══════════════════════════════════════════ */
:root {
  --void: #080810;
  --void2: #0d0d1a;
  --void3: #111124;
  --void4: #16162e;
  --glass: rgba(255,255,255,0.03);
  --glass2: rgba(255,255,255,0.06);
  --glass3: rgba(255,255,255,0.09);
  --b0: rgba(255,255,255,0.04);
  --b1: rgba(255,255,255,0.07);
  --b2: rgba(255,255,255,0.12);
  --b3: rgba(255,255,255,0.18);
  --t0: #ffffff;
  --t1: #e8e8ff;
  --t2: #9494c0;
  --t3: #4a4a70;
  --t4: #252540;
  /* Accent system */
  --snap: #FFFC00;       /* snap yellow */
  --volt: #39ff14;       /* neon green */
  --plasma: #ff2cf1;     /* plasma pink */
  --ice: #00d4ff;        /* ice blue */
  --fire: #ff6a00;       /* fire orange */
  --gold: #ffd700;       /* level gold */
  --chrome: #c8c8e8;     /* chrome */
  /* Semantic */
  --success: #00e676;
  --danger: #ff3d3d;
  --warn: #ffaa00;
  /* Fonts */
  --font: 'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
  --mono: 'Space Mono', monospace;
  /* Snap layout */
  --nav-h: 60px;
  --bot-h: 70px;
  --r: 20px;
  --rs: 12px;
  --rx: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--void);}
body{font-family:var(--font);color:var(--t1);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:2px;height:2px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--glass3);border-radius:99px;}
button{cursor:pointer;}
input,textarea,button{font-family:var(--font);}

/* ── LOADING ── */
#ls{
  position:fixed;inset:0;z-index:9999;background:var(--void);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#ls.gone{animation:fadeOut .5s forwards;}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.ls-logo{
  font-family:var(--display);font-size:72px;font-weight:800;letter-spacing:-.02em;
  color:var(--snap);text-shadow:0 0 60px rgba(255,252,0,.4),0 0 120px rgba(255,252,0,.15);
  animation:logoPop 2s ease-in-out infinite alternate;
}
@keyframes logoPop{0%{transform:scale(1);}100%{transform:scale(1.04);}}
.ls-ring{width:40px;height:40px;border:2px solid var(--glass3);border-top-color:var(--snap);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── AUTH ── */
#auth-screen{
  position:fixed;inset:0;z-index:100;background:var(--void);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.auth-bg{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 80% at 0% 100%,rgba(255,252,0,.12) 0%,transparent 60%),
             radial-gradient(ellipse 60% 60% at 100% 0%,rgba(255,44,241,.1) 0%,transparent 60%),
             radial-gradient(ellipse at 50% 50%,rgba(0,212,255,.05) 0%,transparent 70%);
}
/* Snap-style auth — full-height card, centered */
.auth-card{
  position:relative;z-index:1;
  background:rgba(13,13,26,.95);
  border:1px solid var(--b2);
  border-radius:28px;
  padding:0;
  width:380px;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,252,0,.08),0 40px 80px rgba(0,0,0,.7);
  animation:slideUp .5s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}
.auth-snap-bar{
  height:6px;
  background:linear-gradient(90deg,var(--snap),var(--plasma),var(--ice),var(--volt));
}
.auth-inner{padding:32px 28px 28px;}
.auth-logo{
  font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.02em;
  color:var(--snap);margin-bottom:4px;
}
.auth-sub{font-size:12px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:28px;}
.auth-tabs{
  display:flex;background:var(--void3);border-radius:12px;padding:4px;margin-bottom:24px;
}
.auth-tab{
  flex:1;padding:9px;border:none;background:transparent;color:var(--t3);
  font-size:12px;font-weight:700;border-radius:9px;transition:.2s;
  text-transform:uppercase;letter-spacing:.08em;
}
.auth-tab.on{background:var(--snap);color:#000;box-shadow:0 4px 16px rgba(255,252,0,.3);}
.fg{margin-bottom:14px;}
.fl{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em;}
.fi{
  width:100%;background:var(--void3);border:1px solid var(--b1);
  border-radius:var(--rx);padding:11px 14px;color:var(--t1);
  font-size:13px;outline:none;transition:.2s;
}
.fi:focus{border-color:var(--snap);box-shadow:0 0 0 3px rgba(255,252,0,.1);}
.fi::placeholder{color:var(--t4);}
.btn-snap{
  width:100%;padding:13px;border:none;border-radius:var(--rx);
  background:var(--snap);color:#000;font-size:13px;font-weight:800;
  text-transform:uppercase;letter-spacing:.1em;transition:.2s;margin-top:4px;
}
.btn-snap:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,252,0,.4);}
.btn-snap:active{transform:none;}
.auth-err{
  background:rgba(255,61,61,.08);border:1px solid rgba(255,61,61,.2);
  border-radius:var(--rx);padding:9px 12px;color:#ff9999;font-size:12px;
  margin-bottom:12px;display:none;
}
.auth-err.on{display:block;animation:shake .3s;}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

/* ══════════════════════════════════════
   CHAT SCREEN — SNAP VERTICAL LAYOUT
   Bottom nav, no left sidebar by default
   Story-row at top, chat list vertically
══════════════════════════════════════ */
#chat-screen{display:none;width:100%;height:100%;flex-direction:column;background:var(--void);}
#chat-screen.on{display:flex;}

/* ── Top bar ── */
.topbar{
  height:var(--nav-h);padding:0 16px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:rgba(8,8,16,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--b0);position:relative;z-index:50;
}
.topbar-logo{
  font-family:var(--display);font-size:22px;font-weight:800;
  color:var(--snap);letter-spacing:-.02em;
}
.topbar-room{
  flex:1;display:flex;flex-direction:column;align-items:center;
}
.topbar-room-name{font-size:14px;font-weight:700;color:var(--t0);}
.topbar-room-sub{font-size:10px;color:var(--t3);}
.topbar-actions{display:flex;gap:4px;}
.tbn{
  background:none;border:none;color:var(--t2);
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px;transition:.15s;
}
.tbn:hover{color:var(--t1);background:var(--glass2);}
.tbn.on{color:var(--snap);}

/* ── Main content area ── */
.chat-body{flex:1;display:flex;overflow:hidden;position:relative;}

/* ── LEFT NAV (icon rail) ── */
.left-rail{
  width:60px;background:var(--void2);border-right:1px solid var(--b0);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;
  flex-shrink:0;
}
.rail-btn{
  width:44px;height:44px;border-radius:13px;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  color:var(--t3);transition:.15s;position:relative;
}
.rail-btn:hover{background:var(--glass2);color:var(--t1);}
.rail-btn.on{background:rgba(255,252,0,.12);color:var(--snap);}
.rail-badge{
  position:absolute;top:5px;right:5px;
  background:var(--plasma);color:white;font-size:9px;font-weight:800;
  min-width:16px;height:16px;border-radius:99px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--void2);
}

/* ── CENTER area ── */
.center-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

/* ── RIGHT PANEL ── */
.right-panel{
  width:260px;background:var(--void2);border-left:1px solid var(--b0);
  display:flex;flex-direction:column;overflow:hidden;
}
.right-panel.closed{display:none;}

/* ═══════════════════════════════════
   VIEWS — each is a "snap card stack"
═══════════════════════════════════ */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;}
.view.on{display:flex;}

/* ── CHATS VIEW ── */
.snap-stories{
  padding:12px 12px 0;display:flex;gap:10px;overflow-x:auto;
  scrollbar-width:none;flex-shrink:0;
}
.snap-stories::-webkit-scrollbar{display:none;}
.story-bubble{
  display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;
  cursor:pointer;
}
.story-ring{
  width:52px;height:52px;border-radius:50%;padding:2px;
  background:conic-gradient(var(--snap),var(--plasma),var(--ice),var(--snap));
  transition:.2s;
}
.story-ring:hover{transform:scale(1.08);}
.story-ring.unseen{animation:storyPulse 2s ease-in-out infinite;}
@keyframes storyPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,252,0,.4);}50%{box-shadow:0 0 0 6px rgba(255,252,0,0);}}
.story-ring.me-ring{background:conic-gradient(var(--plasma),var(--ice),var(--volt),var(--plasma));}
.story-inner{
  width:100%;height:100%;border-radius:50%;border:2px solid var(--void);
  overflow:hidden;background:var(--void3);
}
.story-inner img{width:100%;height:100%;object-fit:cover;display:block;}
.story-name{font-size:10px;color:var(--t2);text-align:center;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.story-add{
  width:52px;height:52px;border-radius:50%;background:var(--void3);border:2px dashed var(--b2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--t3);
  cursor:pointer;transition:.2s;
}
.story-add:hover{border-color:var(--snap);color:var(--snap);}

/* Chat list */
.chat-list{flex:1;overflow-y:auto;padding:8px 0;}
.chat-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;transition:.15s;cursor:pointer;position:relative;
}
.chat-item:hover{background:var(--glass);}
.chat-item.on{background:rgba(255,252,0,.05);border-right:2px solid var(--snap);}
.ci-av{position:relative;flex-shrink:0;}
.ci-av-img{width:44px;height:44px;border-radius:13px;display:block;object-fit:cover;background:var(--void3);}
.ci-ring{
  position:absolute;inset:-2px;border-radius:15px;
  background:conic-gradient(var(--snap),var(--plasma),var(--ice),var(--snap));
  z-index:-1;animation:ringRot 4s linear infinite;
}
@keyframes ringRot{to{transform:rotate(360deg);}}
.ci-ring.owner{background:conic-gradient(#ff006e,#ff6b35,#ffd166,#06ffa5,#4f9eff,#c77dff,#ff006e);}
.status-dot{
  position:absolute;bottom:-1px;right:-1px;
  width:12px;height:12px;border-radius:50%;border:2px solid var(--void);z-index:1;
}
.status-dot.online{background:var(--volt);}
.status-dot.away{background:var(--warn);}
.status-dot.dnd{background:var(--danger);}
.status-dot.offline{background:var(--t4);}
.ci-body{flex:1;min-width:0;}
.ci-top{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
.ci-name{font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-time{font-size:10px;color:var(--t3);font-family:var(--mono);flex-shrink:0;margin-left:auto;}
.ci-preview{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-badge{
  background:var(--snap);color:#000;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:99px;padding:0 5px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  animation:badgePop .3s cubic-bezier(.16,1,.3,1);
}
@keyframes badgePop{from{transform:scale(0)}to{transform:scale(1)}}
.ci-hash{font-size:11px;color:var(--t3);margin-right:2px;}

/* Section headers */
.list-section{
  padding:8px 14px 4px;font-size:10px;font-weight:800;color:var(--t3);
  text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;gap:8px;
}
.list-section-line{flex:1;height:1px;background:var(--b0);}
.section-add{
  background:none;border:none;color:var(--t3);font-size:16px;
  padding:2px;border-radius:6px;transition:.15s;
}
.section-add:hover{color:var(--snap);background:rgba(255,252,0,.08);}

/* ═══════════════════════════════════
   MESSAGES AREA
═══════════════════════════════════ */
.msg-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.msgs-scroll{flex:1;overflow-y:auto;padding:12px 12px 4px;}
.msgs-inner{display:flex;flex-direction:column;gap:2px;}

/* Date pill */
.date-pill{
  display:flex;align-items:center;gap:10px;margin:16px 0 8px;
  font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;
}
.date-pill::before,.date-pill::after{content:'';flex:1;height:1px;background:var(--b0);}
.date-pill span{
  background:var(--void3);border:1px solid var(--b1);
  padding:3px 12px;border-radius:99px;
}

/* Message bubble — snap style */
.msg-row{
  display:flex;align-items:flex-end;gap:8px;padding:2px 0;
  animation:msgIn .18s cubic-bezier(.16,1,.3,1);
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg-row.mine{flex-direction:row-reverse;}
.msg-row.cont .msg-av-wrap{visibility:hidden;}
.msg-av-wrap{flex-shrink:0;cursor:pointer;}
.msg-av-img{width:30px;height:30px;border-radius:9px;display:block;object-fit:cover;background:var(--void3);}
.msg-av-ring{
  padding:1.5px;border-radius:10px;display:inline-block;
  background:conic-gradient(var(--snap),var(--plasma),var(--snap));
}
.msg-av-ring.owner{background:conic-gradient(#ff006e,#ff6b35,#ffd166,#06ffa5,#4f9eff,#c77dff,#ff006e);}
.msg-av-ring img{display:block;border-radius:8px;border:1.5px solid var(--void);}

.msg-bubble-wrap{display:flex;flex-direction:column;gap:2px;max-width:72%;min-width:0;}
.msg-row.mine .msg-bubble-wrap{align-items:flex-end;}
.msg-meta{
  display:flex;align-items:center;gap:6px;padding:0 4px;
  font-size:11px;color:var(--t3);
}
.msg-meta-name{font-weight:700;color:var(--t2);cursor:pointer;}
.msg-meta-name:hover{color:var(--snap);}
.msg-meta-time{font-family:var(--mono);font-size:10px;}
.msg-meta-badge{
  font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.05em;
}
/* level badge colors */
.lvl-1{background:rgba(148,148,192,.15);color:var(--t2);}
.lvl-2{background:rgba(0,212,255,.12);color:var(--ice);}
.lvl-3{background:rgba(57,255,20,.12);color:var(--volt);}
.lvl-4{background:rgba(255,106,0,.12);color:var(--fire);}
.lvl-5{background:rgba(255,44,241,.12);color:var(--plasma);}
.lvl-6{
  background:linear-gradient(90deg,rgba(255,252,0,.15),rgba(255,44,241,.15));
  color:var(--snap);animation:goldShine 3s linear infinite;
}
@keyframes goldShine{0%,100%{color:var(--snap);}50%{color:var(--plasma);}}
.owner-badge-msg{
  font-size:9px;font-weight:800;padding:1px 8px;border-radius:99px;
  background:linear-gradient(90deg,#ff006e,#ff6b35,#ffd166,#06ffa5);
  background-size:200%;animation:ownerAnim 2s linear infinite;
  color:white;
}
@keyframes ownerAnim{0%{background-position:0%;}100%{background-position:200%;}}

.bubble{
  padding:9px 13px;border-radius:18px;
  font-size:13.5px;line-height:1.55;color:var(--t1);
  word-break:break-word;white-space:pre-wrap;position:relative;
  cursor:default;
}
/* Others' bubble */
.bubble.theirs{
  background:var(--void3);border:1px solid var(--b1);
  border-bottom-left-radius:5px;
}
/* Mine */
.bubble.mine{
  background:var(--snap);color:#000;font-weight:500;
  border-bottom-right-radius:5px;
}
.bubble.mine a{color:#000;}
/* Custom chat tags from shop */
.bubble.tag-fire{border-color:rgba(255,106,0,.4);background:rgba(255,106,0,.08);}
.bubble.tag-ice{border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06);}
.bubble.tag-plasma{border-color:rgba(255,44,241,.3);background:rgba(255,44,241,.06);}
.bubble.tag-rainbow{
  border-image:linear-gradient(90deg,#ff006e,#ff6b35,#ffd166,#06ffa5,#4f9eff,#c77dff) 1;
  border-width:1px;border-style:solid;background:var(--void3);
}
.bubble.tag-neon{
  box-shadow:0 0 12px rgba(57,255,20,.2),inset 0 0 8px rgba(57,255,20,.04);
  border-color:rgba(57,255,20,.3);background:rgba(57,255,20,.04);
}
.bubble a{color:var(--ice);text-decoration:none;}
.bubble a:hover{text-decoration:underline;}

/* Media in bubbles */
.bubble-media{border-radius:14px;overflow:hidden;max-width:260px;margin-top:4px;}
.bubble-media img{width:100%;display:block;border-radius:14px;}

/* Reactions on bubble */
.bubble-reactions{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
.rx-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--void3);border:1px solid var(--b1);
  border-radius:99px;padding:2px 8px;font-size:12px;cursor:pointer;transition:.15s;
}
.rx-chip:hover{border-color:var(--snap);transform:scale(1.05);}
.rx-chip.mine{background:rgba(255,252,0,.1);border-color:rgba(255,252,0,.3);color:var(--snap);}
.rx-chip .rxc{font-size:11px;font-weight:700;}

/* Reply preview */
.bubble-reply{
  border-left:2px solid var(--ice);background:rgba(0,212,255,.05);
  border-radius:0 8px 8px 0;padding:4px 8px;margin-bottom:4px;
  cursor:pointer;transition:.15s;
}
.bubble-reply:hover{background:rgba(0,212,255,.08);}
.bry-name{font-size:11px;font-weight:700;color:var(--ice);}
.bry-text{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}

/* Hover actions */
.msg-row{position:relative;}
.bubble-actions{
  position:absolute;top:-28px;
  background:var(--void3);border:1px solid var(--b2);
  border-radius:99px;display:flex;overflow:hidden;
  opacity:0;pointer-events:none;transition:.15s;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.msg-row:hover .bubble-actions{opacity:1;pointer-events:all;}
.msg-row.mine .bubble-actions{right:0;}
.msg-row:not(.mine) .bubble-actions{left:38px;}
.bact{
  background:none;border:none;padding:5px 9px;font-size:14px;color:var(--t2);transition:.1s;
}
.bact:hover{background:var(--glass3);color:var(--t1);}
.bact.danger:hover{color:var(--danger);}

/* Pinned */
.pinned-flag{font-size:10px;color:var(--warn);font-weight:700;display:flex;align-items:center;gap:3px;margin-bottom:2px;}

/* Typing */
.typing-row{
  padding:4px 12px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--t3);flex-shrink:0;min-height:24px;
}
.typing-dots{display:flex;gap:3px;align-items:center;}
.typing-dots span{
  width:4px;height:4px;border-radius:50%;background:var(--plasma);
  animation:tdot 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,80%,100%{transform:scale(1);}40%{transform:scale(1.8);}}

/* Reply bar */
.reply-strip{
  display:none;margin:0 12px 6px;padding:7px 10px;
  background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);
  border-radius:12px;align-items:center;gap:8px;flex-shrink:0;
}
.reply-strip.on{display:flex;animation:slideUp .15s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.rs-ico{font-size:16px;color:var(--ice);}
.rs-body{flex:1;min-width:0;}
.rs-name{font-size:11px;font-weight:700;color:var(--ice);}
.rs-text{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs-close{background:none;border:none;color:var(--t3);font-size:17px;padding:2px;border-radius:5px;transition:.15s;}
.rs-close:hover{color:var(--danger);}

/* ── INPUT ── */
.input-zone{padding:8px 12px 14px;flex-shrink:0;}
.input-wrap{
  background:var(--void3);border:1px solid var(--b2);
  border-radius:20px;display:flex;align-items:flex-end;gap:0;
  transition:.2s;overflow:hidden;
}
.input-wrap:focus-within{border-color:rgba(255,252,0,.35);box-shadow:0 0 0 3px rgba(255,252,0,.06);}
.input-btns-left{display:flex;padding:8px 2px 8px 8px;gap:2px;flex-shrink:0;}
.inp-btn{
  background:none;border:none;color:var(--t3);padding:6px;border-radius:8px;font-size:18px;transition:.15s;
  display:flex;align-items:center;justify-content:center;
}
.inp-btn:hover{color:var(--snap);background:rgba(255,252,0,.08);}
.msg-ta{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--t1);font-size:14px;resize:none;
  padding:11px 6px;max-height:140px;line-height:1.5;
}
.msg-ta::placeholder{color:var(--t4);}
.send-snap{
  background:var(--snap);border:none;border-radius:14px;
  width:40px;height:40px;margin:7px 7px 7px 0;
  display:flex;align-items:center;justify-content:center;
  color:#000;font-size:18px;transition:.2s;flex-shrink:0;
  box-shadow:0 4px 14px rgba(255,252,0,.35);
}
.send-snap:hover{transform:scale(1.08) rotate(-8deg);box-shadow:0 6px 20px rgba(255,252,0,.5);}
.send-snap:active{transform:scale(.95);}
.send-snap:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;}
.send-snap svg{width:17px;height:17px;fill:#000;}
.char-cnt{font-size:10px;color:var(--t4);padding:0 6px 4px;text-align:right;font-family:var(--mono);display:none;}
.char-cnt.warn{color:var(--warn);}
.char-cnt.over{color:var(--danger);}

/* ═══════════════════════════════════
   PICKERS
═══════════════════════════════════ */
.picker-float{
  position:absolute;bottom:80px;left:12px;
  background:var(--void3);border:1px solid var(--b2);
  border-radius:18px;padding:12px;z-index:200;
  box-shadow:0 20px 60px rgba(0,0,0,.6);display:none;
  animation:popUp .15s cubic-bezier(.16,1,.3,1);
}
.picker-float.on{display:block;}
@keyframes popUp{from{opacity:0;transform:scale(.92)translateY(6px);}to{opacity:1;transform:none;}}
/* Emoji picker */
#emoji-picker{width:300px;}
.ep-search{
  width:100%;background:var(--void4);border:1px solid var(--b1);
  border-radius:99px;padding:6px 12px;color:var(--t1);font-size:12px;outline:none;margin-bottom:8px;
}
.ep-search::placeholder{color:var(--t3);}
.ep-cats{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;}
.ep-cats::-webkit-scrollbar{display:none;}
.ep-cat{
  background:none;border:none;padding:4px 8px;border-radius:8px;
  font-size:12px;color:var(--t3);transition:.15s;white-space:nowrap;
}
.ep-cat:hover,.ep-cat.on{background:var(--void4);color:var(--t1);}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:160px;overflow-y:auto;}
.ep-e{
  background:none;border:none;font-size:20px;padding:3px;border-radius:7px;
  transition:.1s;aspect-ratio:1;line-height:1;
}
.ep-e:hover{background:var(--void4);transform:scale(1.3);}
/* GIF picker */
#gif-picker{width:280px;}
.gif-search{
  width:100%;background:var(--void4);border:1px solid var(--b1);
  border-radius:99px;padding:6px 12px;color:var(--t1);font-size:12px;outline:none;margin-bottom:8px;
}
.gif-search::placeholder{color:var(--t3);}
.gif-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:220px;overflow-y:auto;}
.gif-cell{border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:var(--void4);}
.gif-cell img{width:100%;height:100%;object-fit:cover;transition:.15s;}
.gif-cell:hover img{transform:scale(1.05);}
.gif-credit{font-size:10px;color:var(--t4);text-align:center;margin-top:6px;}

/* ═══════════════════════════════════
   RIGHT PANEL — user profile / shop
═══════════════════════════════════ */
.rp-head{
  padding:14px 12px;border-bottom:1px solid var(--b0);
  font-size:11px;font-weight:800;color:var(--t3);
  text-transform:uppercase;letter-spacing:.1em;
  display:flex;align-items:center;justify-content:space-between;
}
.rp-scroll{flex:1;overflow-y:auto;padding:8px;}
.rp-title{font-size:13px;font-weight:700;color:var(--t2);margin:8px 0 4px;}
.uc{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:12px;cursor:pointer;transition:.15s;
}
.uc:hover{background:var(--glass);}
.uc-av{position:relative;flex-shrink:0;}
.uc-av img{width:32px;height:32px;border-radius:9px;display:block;object-fit:cover;background:var(--void4);}
.uc-info{flex:1;min-width:0;}
.uc-name{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uc-lv{font-size:10px;color:var(--t3);}

/* ═══════════════════════════════════
   XP & LEVEL SYSTEM
═══════════════════════════════════ */
.xp-bar-wrap{
  padding:8px 12px;background:var(--void2);border-bottom:1px solid var(--b0);
  flex-shrink:0;
}
.xp-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.xp-level{
  font-family:var(--display);font-size:14px;font-weight:800;color:var(--snap);
  background:rgba(255,252,0,.1);border:1px solid rgba(255,252,0,.2);
  padding:2px 9px;border-radius:99px;flex-shrink:0;
}
.xp-label{font-size:11px;color:var(--t3);flex:1;}
.xp-credits{
  display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--gold);
  background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
  padding:2px 9px;border-radius:99px;cursor:pointer;transition:.15s;
}
.xp-credits:hover{background:rgba(255,215,0,.14);}
.xp-bar-bg{height:4px;background:var(--void4);border-radius:99px;overflow:hidden;}
.xp-bar-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--snap),var(--plasma));
  transition:width .6s cubic-bezier(.16,1,.3,1);
}

/* ═══════════════════════════════════
   SHOP VIEW
═══════════════════════════════════ */
.shop-view{flex:1;overflow-y:auto;padding:12px;}
.shop-hdr{
  text-align:center;padding:16px 0;
  font-family:var(--display);font-size:28px;font-weight:800;color:var(--snap);
  letter-spacing:-.02em;
}
.shop-balance{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:16px;
  font-size:14px;font-weight:700;color:var(--gold);
}
.shop-tabs{
  display:flex;background:var(--void3);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px;
}
.shop-tab{
  flex:1;padding:8px;border:none;background:transparent;color:var(--t3);
  font-size:11px;font-weight:700;border-radius:9px;transition:.2s;
  text-transform:uppercase;letter-spacing:.06em;
}
.shop-tab.on{background:var(--void4);color:var(--t1);border:1px solid var(--b2);}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shop-card{
  background:var(--void3);border:1px solid var(--b1);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:8px;
  transition:.2s;cursor:pointer;position:relative;overflow:hidden;
}
.shop-card:hover{border-color:var(--b2);transform:translateY(-2px);}
.shop-card.owned{border-color:rgba(57,255,20,.3);background:rgba(57,255,20,.04);}
.shop-card.owned .shop-buy{background:rgba(57,255,20,.15);color:var(--volt);}
.shop-preview{
  height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:28px;background:var(--void4);overflow:hidden;position:relative;
}
/* Animated previews */
.preview-anim-fire{
  background:linear-gradient(135deg,#ff6a00,#ff3d3d);
  animation:fireAnim 2s ease-in-out infinite alternate;
}
@keyframes fireAnim{0%{background:linear-gradient(135deg,#ff6a00,#ff3d3d);}100%{background:linear-gradient(135deg,#ff3d3d,#ff6a00);}}
.preview-anim-ice{
  background:linear-gradient(135deg,#00d4ff,#0080ff);
  animation:iceAnim 2s ease-in-out infinite alternate;
}
@keyframes iceAnim{0%{background:linear-gradient(135deg,#00d4ff,#0080ff);}100%{background:linear-gradient(135deg,#0080ff,#00d4ff);}}
.preview-anim-plasma{
  background:linear-gradient(135deg,#ff2cf1,#7700ff);
  animation:plasmaAnim 2s ease-in-out infinite alternate;
}
@keyframes plasmaAnim{0%{background:linear-gradient(135deg,#ff2cf1,#7700ff);}100%{background:linear-gradient(135deg,#7700ff,#ff2cf1);}}
.preview-anim-rainbow{
  background:linear-gradient(90deg,#ff006e,#ff6b35,#ffd166,#06ffa5,#4f9eff,#c77dff);
  background-size:200%;animation:rbAnim 3s linear infinite;
}
@keyframes rbAnim{0%{background-position:0%;}100%{background-position:200%;}}
.preview-anim-neon{
  background:#001a00;
  box-shadow:inset 0 0 30px rgba(57,255,20,.3);
  animation:neonPulse 1.5s ease-in-out infinite alternate;
}
@keyframes neonPulse{0%{box-shadow:inset 0 0 30px rgba(57,255,20,.3);}100%{box-shadow:inset 0 0 50px rgba(57,255,20,.5);}}
.preview-anim-gold{
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  animation:goldAnim 2s ease-in-out infinite alternate;
}
.preview-anim-chrome{
  background:linear-gradient(135deg,#c8c8e8,#6868a8,#c8c8e8);
  background-size:200%;animation:chromeAnim 3s linear infinite;
}
@keyframes chromeAnim{0%{background-position:0%;}100%{background-position:200%;}}
.shop-item-name{font-size:13px;font-weight:700;color:var(--t1);}
.shop-item-desc{font-size:11px;color:var(--t3);line-height:1.4;}
.shop-buy{
  background:rgba(255,252,0,.12);border:1px solid rgba(255,252,0,.25);
  color:var(--snap);font-size:11px;font-weight:800;padding:6px;border-radius:9px;
  text-transform:uppercase;letter-spacing:.06em;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.shop-buy:hover{background:rgba(255,252,0,.2);}
.shop-new-tag{
  position:absolute;top:8px;right:8px;
  background:var(--plasma);color:white;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;
}

/* ═══════════════════════════════════
   PROFILE / LEVEL VIEW
═══════════════════════════════════ */
.profile-view{flex:1;overflow-y:auto;padding:0;}
.profile-banner{
  height:140px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--snap),var(--plasma),var(--ice));
}
.profile-banner-anim{
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  background-size:200%;animation:bannerShine 3s linear infinite;
}
@keyframes bannerShine{0%{background-position:-100%;}100%{background-position:200%;}}
.profile-av-big{
  position:absolute;bottom:-26px;left:20px;z-index:1;
  width:64px;height:64px;border-radius:16px;border:3px solid var(--void);
  overflow:hidden;background:var(--void3);
}
.profile-av-big img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-body{padding:36px 20px 20px;}
.profile-name{font-family:var(--display);font-size:22px;font-weight:800;color:var(--t0);margin-bottom:2px;}
.profile-handle{font-size:12px;color:var(--t3);font-family:var(--mono);margin-bottom:12px;}
/* Level ring stats */
.level-ring-container{display:flex;justify-content:center;padding:16px 0;}
.level-ring{position:relative;width:120px;height:120px;}
.level-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.level-ring-text{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.lrt-num{font-family:var(--display);font-size:32px;font-weight:800;color:var(--snap);line-height:1;}
.lrt-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;}
.profile-stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;
}
.stat-card{
  background:var(--void3);border:1px solid var(--b1);border-radius:12px;
  padding:10px 8px;text-align:center;
}
.stat-n{font-family:var(--display);font-size:22px;font-weight:800;color:var(--t1);}
.stat-l{font-size:10px;color:var(--t3);}
.badges-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.profile-badge{
  padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;
  border:1px solid;
}

/* ═══════════════════════════════════
   NOTIFICATIONS VIEW
═══════════════════════════════════ */
.notif-view{flex:1;overflow-y:auto;padding:12px;}
.notif-card{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--void3);border:1px solid var(--b1);border-radius:14px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;
}
.notif-card:hover{background:var(--void4);}
.notif-card.unread{border-color:rgba(255,252,0,.2);background:rgba(255,252,0,.03);}
.notif-av img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.notif-text{flex:1;min-width:0;}
.notif-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:2px;}
.notif-body{font-size:12px;color:var(--t3);}
.notif-time{font-size:10px;color:var(--t4);font-family:var(--mono);}
.notif-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--snap);flex-shrink:0;margin-top:4px;}

/* ═══════════════════════════════════
   WELCOME / SEARCH STATE
═══════════════════════════════════ */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;text-align:center;
}
.empty-glyph{
  font-family:var(--display);font-size:80px;font-weight:800;
  color:var(--snap);opacity:.1;margin-bottom:20px;
}
.empty-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--t3);max-width:240px;line-height:1.7;}

/* ═══════════════════════════════════
   MODALS
═══════════════════════════════════ */
.modal-bg{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.7);backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
}
.modal-bg.on{display:flex;}
.modal{
  background:var(--void2);border:1px solid var(--b2);
  border-radius:24px;padding:28px;width:400px;max-height:90vh;overflow-y:auto;
  box-shadow:0 40px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
  animation:slideUp .25s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:none;border:none;color:var(--t3);font-size:20px;padding:4px;
  border-radius:8px;transition:.15s;
}
.modal-close:hover{color:var(--t1);background:var(--glass2);}
.modal-title{font-family:var(--display);font-size:22px;font-weight:800;color:var(--t1);margin-bottom:18px;}
.mf{margin-bottom:14px;}
.ml{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em;}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.btn-ghost{
  padding:10px 18px;background:transparent;border:1px solid var(--b2);
  border-radius:var(--rx);color:var(--t2);font-size:13px;font-weight:600;transition:.15s;
}
.btn-ghost:hover{background:var(--glass2);color:var(--t1);}
.btn-primary{
  padding:10px 20px;background:var(--snap);border:none;border-radius:var(--rx);
  color:#000;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  transition:.2s;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,252,0,.4);}
/* Status picker */
.status-grid{display:flex;gap:6px;flex-wrap:wrap;}
.sp{
  padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--b2);background:var(--void3);color:var(--t2);transition:.15s;
}
.sp[data-s="online"].on{background:rgba(57,255,20,.1);border-color:rgba(57,255,20,.3);color:var(--volt);}
.sp[data-s="away"].on{background:rgba(255,170,0,.1);border-color:rgba(255,170,0,.3);color:var(--warn);}
.sp[data-s="dnd"].on{background:rgba(255,61,61,.1);border-color:rgba(255,61,61,.3);color:var(--danger);}
.sp[data-s="offline"].on{background:rgba(74,74,112,.15);border-color:rgba(74,74,112,.3);color:var(--t2);}

/* ═══════════════════════════════════
   TOASTS
═══════════════════════════════════ */
#toasts{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;width:max-content;max-width:380px;
}
.toast{
  background:var(--void3);border:1px solid var(--b2);border-radius:14px;
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--t1);
  box-shadow:0 8px 30px rgba(0,0,0,.6);
  animation:toastIn .3s cubic-bezier(.16,1,.3,1);
  display:flex;align-items:center;gap:8px;
}
.toast.error{border-color:rgba(255,61,61,.3);color:#ff9999;}
.toast.success{border-color:rgba(57,255,20,.25);color:var(--volt);}
.toast.info{border-color:rgba(0,212,255,.25);color:var(--ice);}
.toast.level{
  border-color:rgba(255,252,0,.4);color:var(--snap);
  background:rgba(255,252,0,.08);font-family:var(--display);font-size:16px;font-weight:800;
  box-shadow:0 0 30px rgba(255,252,0,.2);
}
.toast.credit{border-color:rgba(255,215,0,.3);color:var(--gold);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.9);}to{opacity:1;transform:none;}}

/* In-app notif banner */
#notif-stack{
  position:fixed;top:68px;right:12px;z-index:9998;
  display:flex;flex-direction:column;gap:6px;max-width:280px;
}
.notif-banner{
  background:var(--void3);border:1px solid var(--b2);border-radius:16px;
  padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);cursor:pointer;transition:.15s;
  animation:notifIn .3s cubic-bezier(.16,1,.3,1);
}
.notif-banner:hover{background:var(--void4);}
@keyframes notifIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
.nb-av img{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block;}
.nb-body{flex:1;min-width:0;}
.nb-title{font-size:12px;font-weight:700;color:var(--t1);}
.nb-msg{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-close{background:none;border:none;color:var(--t4);font-size:16px;padding:0;transition:.15s;}
.nb-close:hover{color:var(--t1);}

/* Level up celebration */
#level-up-overlay{
  position:fixed;inset:0;z-index:9997;pointer-events:none;
  display:none;
}
.luo-text{
  position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--display);font-size:72px;font-weight:800;color:var(--snap);
  text-align:center;text-shadow:0 0 60px rgba(255,252,0,.6);
  animation:luoPop .5s cubic-bezier(.16,1,.3,1);
}
@keyframes luoPop{from{transform:translate(-50%,-50%) scale(.4);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.confetti-piece{
  position:absolute;top:-10px;border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0) scale(1);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg) scale(.8);opacity:0;}
}

/* XP popup */
.xp-popup{
  position:fixed;pointer-events:none;z-index:9996;
  font-family:var(--display);font-size:18px;font-weight:800;color:var(--snap);
  animation:xpFloat 1.5s ease forwards;
}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}

/* ═══════════════════════════════════
   USER TOOLTIP
═══════════════════════════════════ */
.utt{
  position:fixed;z-index:800;
  background:var(--void2);border:1px solid var(--b2);border-radius:20px;
  width:220px;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  animation:popUp .15s ease;
}
.utt-banner{
  height:56px;background:linear-gradient(135deg,var(--snap),var(--plasma));
}
.utt-body{padding:0 14px 14px;}
.utt-av{
  width:50px;height:50px;border-radius:13px;border:3px solid var(--void2);
  margin:-25px 0 8px;display:inline-block;position:relative;
}
.utt-av img{width:100%;height:100%;border-radius:10px;display:block;object-fit:cover;}
.utt-name{font-size:15px;font-weight:800;color:var(--t1);}
.utt-handle{font-size:11px;color:var(--t3);font-family:var(--mono);margin-bottom:4px;}
.utt-bio{font-size:11px;color:var(--t2);font-style:italic;margin-bottom:6px;line-height:1.4;}
.utt-lvl{
  font-size:11px;color:var(--snap);font-weight:700;
  background:rgba(255,252,0,.1);border:1px solid rgba(255,252,0,.2);
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;margin-bottom:8px;
}
.utt-btn{
  width:100%;padding:8px;background:var(--snap);border:none;border-radius:10px;
  color:#000;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  transition:.2s;
}
.utt-btn:hover{transform:scale(1.02);box-shadow:0 4px 14px rgba(255,252,0,.4);}

/* Mobile responsive */
@media(max-width:700px){
  .right-panel{display:none!important;}
  .left-rail{display:none;}
  .chat-item{padding:9px 12px;}
}
</style>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const API = '';
const WS_URL = (location.protocol==='https:'?'wss://':'ws://')+location.host;
const MAX_MSG = 2000;
const GIPHY_KEY = 'dc6zaTOxFJmzC';

// XP thresholds per level
const LEVEL_XP = [0,100,250,500,900,1500,2400,3700,5500,8000,11500];
const LEVEL_NAMES = ['Newcomer','Chatter','Regular','Active','Veteran','Elite','Legend','Myth','Icon','Deity','GOAT'];
const XP_PER_MSG = 8;
const XP_PER_REACT = 3;
const XP_PER_EDIT = 1;
const CREDITS_PER_MSG = 2;
const CREDITS_PER_LEVEL = 200;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let token = localStorage.getItem('vibe_token');
let currentUser = null;
let ws = null;
let currentRoom = null;
let rooms = [];
let allUsers = [];
let onlineIds = new Set();
let unread = {};
let replyingTo = null;
let editingId = null;
let activePanel = null;
let activeTooltip = null;
let typingMap = {};
let typingTimer = null;
let isTyping = false;
let gifTimer = null;
let pendingBuy = null;
let currentShopTab = 'tags';
let rightOpen = true;
let swReg = null;
let storedNotifs = [];
let unreadNotifCount = 0;

// XP state (persistent per user)
let myXP = 0;
let myLevel = 1;
let myCredits = 0;
let myInventory = {}; // itemId -> true
let myEquipped = {}; // slot -> itemId
let myStats = { msgsSent:0, reactionsGiven:0, daysActive:0 };

// ═══════════════════════════════════════════════════════
//  SHOP DATA
// ═══════════════════════════════════════════════════════
const SHOP = {
  tags: [
    {id:'tag_fire',name:'🔥 Fire Tag',desc:'Your messages blaze with a fire aura',cost:150,preview:'preview-anim-fire',emoji:'🔥',bubbleClass:'tag-fire',type:'tag'},
    {id:'tag_ice',name:'❄️ Ice Tag',desc:'Cool blue chat bubble effect',cost:150,preview:'preview-anim-ice',emoji:'❄️',bubbleClass:'tag-ice',type:'tag'},
    {id:'tag_plasma',name:'💜 Plasma Tag',desc:'Plasma pink glow on your messages',cost:150,preview:'preview-anim-plasma',emoji:'💜',bubbleClass:'tag-plasma',type:'tag'},
    {id:'tag_neon',name:'⚡ Neon Tag',desc:'Electric green neon glow',cost:200,preview:'preview-anim-neon',emoji:'⚡',bubbleClass:'tag-neon',type:'tag'},
    {id:'tag_rainbow',name:'🌈 Rainbow Tag',desc:'Animated rainbow border on messages',cost:350,preview:'preview-anim-rainbow',emoji:'🌈',bubbleClass:'tag-rainbow',type:'tag',isNew:true},
  ],
  banners: [
    {id:'banner_fire',name:'🔥 Fire Banner',desc:'Flaming profile header',cost:100,preview:'preview-anim-fire',emoji:'🔥',type:'banner'},
    {id:'banner_ice',name:'❄️ Ice Banner',desc:'Frosty cool header',cost:100,preview:'preview-anim-ice',emoji:'❄️',type:'banner'},
    {id:'banner_plasma',name:'💜 Plasma Banner',desc:'Electric plasma banner',cost:100,preview:'preview-anim-plasma',emoji:'💜',type:'banner'},
    {id:'banner_rainbow',name:'🌈 Rainbow Banner',desc:'Animated rainbow background',cost:250,preview:'preview-anim-rainbow',emoji:'🌈',type:'banner',isNew:true},
    {id:'banner_chrome',name:'✨ Chrome Banner',desc:'Sleek chrome metallic effect',cost:180,preview:'preview-anim-chrome',emoji:'✨',type:'banner'},
  ],
  avatars: [
    {id:'av_fire_ring',name:'🔥 Fire Ring',desc:'Animated fire ring around ur avatar',cost:200,preview:'preview-anim-fire',emoji:'🔥',type:'avatar'},
    {id:'av_ice_ring',name:'❄️ Ice Ring',desc:'Ice blue animated ring',cost:200,preview:'preview-anim-ice',emoji:'❄️',type:'avatar'},
    {id:'av_gold_ring',name:'👑 Gold Ring',desc:'Shimmering gold ring, flex on them',cost:500,preview:'preview-anim-gold',emoji:'👑',type:'avatar',isNew:true},
    {id:'av_plasma_ring',name:'💜 Plasma Ring',desc:'Plasma glow halo effect',cost:200,preview:'preview-anim-plasma',emoji:'💜',type:'avatar'},
    {id:'av_rainbow_ring',name:'🌈 Rainbow Ring',desc:'Full animated rainbow ring',cost:600,preview:'preview-anim-rainbow',emoji:'🌈',type:'avatar',isNew:true},
  ],
  titles: [
    {id:'title_legend',name:'"Legend" Title',desc:'Show "Legend" below your name',cost:300,preview:'preview-anim-gold',emoji:'🏆',type:'title',value:'Legend'},
    {id:'title_toxic',name:'"Toxic" Title',desc:'If u know u know 💀',cost:80,preview:'preview-anim-neon',emoji:'☠️',type:'title',value:'Toxic'},
    {id:'title_vibe',name:'"Pure Vibes" Title',desc:'Radiate only good energy',cost:150,preview:'preview-anim-plasma',emoji:'✨',type:'title',value:'Pure Vibes'},
    {id:'title_goat',name:'"GOAT" Title',desc:'Greatest of all time. No cap.',cost:800,preview:'preview-anim-rainbow',emoji:'🐐',type:'title',value:'GOAT',isNew:true},
    {id:'title_chaos',name:'"Chaos Agent" Title',desc:'Pure unpredictable energy',cost:120,preview:'preview-anim-fire',emoji:'🌀',type:'title',value:'Chaos Agent'},
  ],
};

// ═══════════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  buildEmojiPicker();
  await initSW();
  if (token) {
    try {
      currentUser = await apiFetch('/api/me');
      loadLocalXP();
      showChat();
    } catch {
      token=null; localStorage.removeItem('vibe_token'); showAuth();
    }
  } else {
    showAuth();
  }
  setTimeout(() => {
    const ls = document.getElementById('ls');
    ls.classList.add('gone');
    setTimeout(()=>ls.remove(),600);
  }, 1400);
});

async function initSW() {
  if (!('serviceWorker' in navigator)) return;
  try { swReg = await navigator.serviceWorker.register('/sw.js'); } catch {}
}

function loadLocalXP() {
  if (!currentUser) return;
  const k = `vibe_xp_${currentUser.id}`;
  const d = JSON.parse(localStorage.getItem(k)||'{}');
  myXP = d.xp||0;
  myLevel = d.level||1;
  myCredits = d.credits||0;
  myInventory = d.inventory||{};
  myEquipped = d.equipped||{};
  myStats = d.stats||{msgsSent:0,reactionsGiven:0,daysActive:0};
  updateXPBar();
}
function saveLocalXP() {
  if (!currentUser) return;
  const k = `vibe_xp_${currentUser.id}`;
  localStorage.setItem(k, JSON.stringify({
    xp:myXP, level:myLevel, credits:myCredits,
    inventory:myInventory, equipped:myEquipped, stats:myStats
  }));
}

function gainXP(amount, source) {
  const prevLevel = myLevel;
  myXP += amount;
  myStats.msgsSent += (source==='msg'?1:0);
  myStats.reactionsGiven += (source==='react'?1:0);
  myCredits += (source==='msg'?CREDITS_PER_MSG:0);
  // Recalc level
  let lv = 1;
  for (let i=1;i<LEVEL_XP.length;i++) { if (myXP>=LEVEL_XP[i]) lv=i+1; else break; }
  myLevel = Math.min(lv, LEVEL_XP.length);
  saveLocalXP();
  updateXPBar();
  // Level up?
  if (myLevel > prevLevel) {
    myCredits += CREDITS_PER_LEVEL;
    saveLocalXP();
    celebrateLevelUp(myLevel);
  }
  // XP popup
  showXPPopup('+'+amount+' XP');
}

function updateXPBar() {
  const curLvXP = LEVEL_XP[myLevel-1]||0;
  const nextLvXP = LEVEL_XP[myLevel]||myXP;
  const pct = nextLvXP > curLvXP ? ((myXP-curLvXP)/(nextLvXP-curLvXP))*100 : 100;
  const el = document.getElementById('xp-bar-fill');
  const lb = document.getElementById('xp-level-badge');
  const xl = document.getElementById('xp-label');
  const cd = document.getElementById('credit-display');
  const sb = document.getElementById('shop-bal');
  if(el) el.style.width = Math.min(pct,100)+'%';
  if(lb) lb.textContent = 'Lv.'+myLevel;
  if(xl) xl.textContent = myXP+' / '+(nextLvXP||'MAX')+' XP · '+LEVEL_NAMES[myLevel-1];
  if(cd) cd.textContent = myCredits;
  if(sb) sb.textContent = myCredits;
}

function showXPPopup(text) {
  const el = document.createElement('div');
  el.className = 'xp-popup';
  el.textContent = text;
  el.style.left = (Math.random()*60+20)+'%';
  el.style.bottom = '120px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
}

function celebrateLevelUp(lv) {
  showToast(`🎉 LEVEL UP! You're now Level ${lv} — ${LEVEL_NAMES[lv-1]}!`, 'level');
  showToast(`💰 +${CREDITS_PER_LEVEL} credits bonus!`, 'credit');
  const overlay = document.getElementById('level-up-overlay');
  overlay.style.display = 'block';
  overlay.innerHTML = `<div class="luo-text">LEVEL ${lv} !</div>`;
  // Confetti
  const colors = ['#FFFC00','#ff2cf1','#00d4ff','#39ff14','#ff6a00','#ffd700'];
  for (let i=0;i<80;i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}%;width:${Math.random()*10+4}px;height:${Math.random()*10+4}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*360}deg);`;
    overlay.appendChild(c);
  }
  setTimeout(()=>{ overlay.style.display='none'; overlay.innerHTML=''; }, 4000);
}

function showAuth() {
  document.getElementById('auth-screen').style.display='';
  document.getElementById('chat-screen').classList.remove('on');
}
function showTab(t) {
  document.getElementById('form-login').style.display = t==='login'?'':'none';
  document.getElementById('form-signup').style.display = t==='signup'?'':'none';
  document.querySelectorAll('.auth-tab').forEach((el,i)=>el.classList.toggle('on',i===(t==='login'?0:1)));
  setErr('');
}
function setErr(m){const el=document.getElementById('auth-err');el.textContent=m;el.classList.toggle('on',!!m);}
async function doLogin() {
  const u=g('l-user').value.trim(),p=g('l-pass').value;
  if(!u||!p)return setErr('Fill in all fields');
  const btn=g('login-btn');btn.disabled=true;btn.textContent='...';
  try{
    const d=await apiFetch('/api/login','POST',{username:u,password:p});
    token=d.token;currentUser=d.user;
    localStorage.setItem('vibe_token',token);
    loadLocalXP();
    showChat();
  }catch(e){setErr(e.message);}
  finally{btn.disabled=false;btn.textContent='Login →';}
}
async function doSignup() {
  const u=g('s-user').value.trim(),dn=g('s-display').value.trim(),p=g('s-pass').value;
  if(!u||!p)return setErr('Username and password required');
  const btn=g('signup-btn');btn.disabled=true;btn.textContent='...';
  try{
    const d=await apiFetch('/api/signup','POST',{username:u,displayName:dn,password:p});
    token=d.token;currentUser=d.user;
    localStorage.setItem('vibe_token',token);
    loadLocalXP();
    showChat();
    setTimeout(()=>showToast('Welcome to VIBE! Chat to earn XP & credits 🚀','info'),1000);
  }catch(e){setErr(e.message);}
  finally{btn.disabled=false;btn.textContent='Create Account →';}
}
function doLogout(){
  token=null;currentUser=null;
  localStorage.removeItem('vibe_token');
  if(ws){ws.close();ws=null;}
  document.getElementById('auth-screen').style.display='';
  document.getElementById('chat-screen').classList.remove('on');
  document.title='VIBE ✦';
}

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+name).classList.add('on');
  document.querySelectorAll('.rail-btn').forEach(b=>b.classList.remove('on'));
  const rb=document.getElementById('rail-'+name);
  if(rb)rb.classList.add('on');
  // topbar
  const tr=document.getElementById('topbar-room');
  if(name==='chat')tr.style.display='';
  else tr.style.display='none';
  // right panel
  if(name==='shop'||name==='profile'||name==='notifs'){
    document.getElementById('right-panel').classList.add('closed');
  } else {
    document.getElementById('right-panel').classList.remove('closed');
  }
  if(name==='profile') renderProfileView();
  if(name==='notifs') renderNotifsView();
  if(name==='shop') renderShopGrid(currentShopTab);
}
function switchRail(name){
  if(name==='home'){switchView('home');return;}
  if(name==='notifs'){unreadNotifCount=0;updateNotifBadge();switchView('notifs');return;}
  if(name==='shop'){switchView('shop');return;}
  if(name==='profile'){switchView('profile');return;}
  if(name==='logout'){doLogout();return;}
}
function openShop(){switchView('shop');document.getElementById('rail-shop').classList.add('on');}

  return '💬';

function openChannel(room){
  currentRoom={type:'channel',id:room.id,name:room.name,desc:room.description||''};
  unread[room.id]=0;
  localStorage.setItem('vibe_last_room',room.id);
  renderChannelsList();renderDMsList();updateTab();
  switchView('chat');
  g('tr-name').textContent='#'+room.name;
  g('tr-sub').textContent=room.description||'channel';
  loadMessages();
  typingMap={};renderTyping();cancelReply();
}
function openDM(userObj){openDMUser(userObj);}
function openDMUser(user){
  currentRoom={type:'dm',id:'dm:'+user.id,toUserId:user.id,name:user.displayName,desc:'@'+user.username};
  const dmId='dm:'+user.id;
  unread[dmId]=0;
  renderChannelsList();renderDMsList();updateTab();
  switchView('chat');
  g('tr-name').textContent=user.displayName;
  g('tr-sub').textContent=onlineIds.has(user.id)?'🟢 online':'⚫ offline';
  loadMessages();
  typingMap={};renderTyping();cancelReply();
}

// ═══════════════════════════════════════════════════════
//  RENDER MESSAGE
// ═══════════════════════════════════════════════════════
function renderMsg(msg, animate=true){
  const inner=g('msgs-inner');
  const user=msg.user||{};
  const isOwner=user.isOwner;
  const isMe=user.id===currentUser?.id;
  const ts=msg.createdAt;

  // Date pill
  const lastD=[...inner.children].filter(el=>el.dataset.date).pop();
  const lastDate=lastD?.dataset.date;
  const thisDate=new Date(ts).toDateString();
  if(lastDate!==thisDate){
    const sep=document.createElement('div');
    sep.className='date-pill';sep.dataset.date=thisDate;
    const today=new Date().toDateString();
    const yest=new Date(Date.now()-86400000).toDateString();
    const lbl=thisDate===today?'Today':thisDate===yest?'Yesterday':new Date(ts).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
    sep.innerHTML=`<span>${lbl}</span>`;
    inner.appendChild(sep);
  }

  // Group continuation
  const lastRow=inner.querySelector('.msg-row[data-uid]:last-of-type');
  const lastUid=lastRow?.dataset.uid;
  const lastTs=parseInt(lastRow?.dataset.ts||0);
  const cont=lastUid===user.id&&(ts-lastTs)<5*60*1000;

  // Get equipped chat tag
  const equippedTag=isMe&&myEquipped.tag?SHOP.tags.find(t=>t.id===myEquipped.tag):null;
  const bubClass=equippedTag?equippedTag.bubbleClass:'';

  const div=document.createElement('div');
  div.className='msg-row'+(isMe?' mine':'')+(cont?' cont':'')+(animate?' anim':'');
  div.dataset.uid=user.id;
  div.dataset.ts=ts;
  div.dataset.mid=msg.id;

  const lv=getUserLevel(user.id);
  const lvClass=isMe?`lvl-${Math.min(myLevel,6)}`:`lvl-${Math.min(lv,6)}`;
  const lvNum=isMe?myLevel:lv;

  // Reply preview
  let replyHtml='';
  if(msg.replyToMsg){
    const ru=msg.replyToMsg.user||{};
    replyHtml=`<div class="bubble-reply" onclick="scrollToMsg('${esc(msg.replyTo)}')">
      <div class="bry-name">${esc(ru.displayName||'?')}</div>
      <div class="bry-text">${esc(msg.replyToMsg.text?.slice(0,80)||'[message]')}</div>
    </div>`;
  }

  // Reactions
  const rxHtml=buildRx(msg.id,msg.reactions||{});

  // Text
  const textHtml=renderText(msg.text||'');

  // Media
  const mediaHtml=msg.mediaUrl?`<div class="bubble-media"><img src="${esc(msg.mediaUrl)}" loading="lazy"/></div>`:'';

  // Actions
  const canDel=user.id===currentUser?.id||currentUser?.isOwner;
  const canEdit=user.id===currentUser?.id;
  const canPin=currentUser?.isOwner;

  // Pinned
  const pinnedHtml=msg.pinned?`<div class="pinned-flag">📌 Pinned</div>`:'';

  const metaHtml=!cont?`
    <div class="msg-meta">
      <span class="msg-meta-name" onclick="showUTT(event,'${esc(user.id)}')">${isOwner?`<span style="background:linear-gradient(90deg,#ff006e,#ff6b35,#ffd166,#06ffa5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200%;animation:ownerAnim 2s linear infinite;">${esc(user.displayName||user.username||'?')}</span>`:esc(user.displayName||user.username||'?')}</span>
      ${isOwner?`<span class="owner-badge-msg">👑 owner</span>`:
        `<span class="msg-meta-badge ${lvClass}">Lv.${lvNum}</span>`}
      ${isMe&&myEquipped.title?`<span class="msg-meta-badge lvl-5" style="background:rgba(255,44,241,.12);color:var(--plasma);">${esc(SHOP.titles.find(t=>t.id===myEquipped.title)?.value||'')}</span>`:''}
      <span class="msg-meta-time">${formatTime(ts)}</span>
      ${msg.edited?`<span style="font-size:10px;color:var(--t4);font-style:italic;">(edited)</span>`:''}
    </div>`:
    `<span style="position:absolute;left:38px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--t4);opacity:0;pointer-events:none;font-family:var(--mono);white-space:nowrap;transition:.1s;" class="time-hover">${formatTime(ts)}</span>`;

  div.innerHTML=`
    ${!isMe?`<div class="msg-av-wrap" onclick="showUTT(event,'${esc(user.id)}')">
      ${isOwner?`<div class="msg-av-ring owner" style="${cont?'visibility:hidden':''}"><img src="${esc(user.avatar||'')}" width="30" height="30" loading="lazy" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=${esc(user.username||'guest')}'"/></div>`:
        `<div class="${cont?'':'msg-av-ring'}" style="${cont?'visibility:hidden':''}"><img class="msg-av-img" src="${esc(user.avatar||'')}" width="30" height="30" loading="lazy" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=${esc(user.username||'guest')}'"/></div>`}
    </div>`:''}
    <div class="msg-bubble-wrap">
      ${metaHtml}
      ${pinnedHtml}
      <div class="bubble ${isMe?'mine':'theirs'} ${bubClass}">
        ${replyHtml}
        ${textHtml}
        ${mediaHtml}
      </div>
      <div class="bubble-reactions" data-rxid="${esc(msg.id)}">${rxHtml}</div>
    </div>
    <div class="bubble-actions">
      ${['😂','❤️','🔥','👍','😮'].map(e=>`<button class="bact" onclick="addReaction('${esc(msg.id)}','${e}')">${e}</button>`).join('')}
      <button class="bact" onclick="startReply('${esc(msg.id)}','${esc(user.displayName||'')}','${esc((msg.text||'').slice(0,60).replace(/'/g,"\\'"))}')">↩</button>
      ${canEdit?`<button class="bact" onclick="openEdit('${esc(msg.id)}','${esc((msg.text||'').replace(/'/g,"\\'").replace(/\n/g,'\\n'))}')">✏️</button>`:''}
      ${canPin?`<button class="bact" onclick="togglePin('${esc(msg.id)}')">${msg.pinned?'📍':'📌'}</button>`:''}
      ${canDel?`<button class="bact danger" onclick="delMsg('${esc(msg.id)}')">🗑️</button>`:''}
    </div>`;
  inner.appendChild(div);
}

function buildRx(msgId,reactions){
  return Object.entries(reactions).filter(([,u])=>u.length>0).map(([emoji,users])=>{
    const mine=users.includes(currentUser?.id);
    return `<span class="rx-chip ${mine?'mine':''}" onclick="addReaction('${msgId}','${emoji}')">
      ${emoji}<span class="rxc">${users.length}</span>
    </span>`;
  }).join('');
}

function renderText(text){
  let t=esc(text);
  // [img:...] and [gif:...]
  t=t.replace(/\[img:(data:[^\]]+)\]/g,(_,d)=>`</div><div class="bubble-media"><img src="${d}" loading="lazy" style="max-height:280px;width:100%;border-radius:12px;"/></div><div>`);
  t=t.replace(/\[gif:([^\]]+)\]/g,(_,u)=>`</div><div class="bubble-media"><img src="${esc(u)}" loading="lazy" style="max-height:200px;width:100%;border-radius:12px;"/></div><div>`);
  // Markdown
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px;">$1</code>');
  t=t.replace(/(https?:\/\/[^\s<"]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  t=t.replace(/\|\|(.+?)\|\|/g,`<span style="background:rgba(255,255,255,.08);color:transparent;border-radius:3px;cursor:pointer;" onclick="this.style.color='inherit'" title="click to reveal">████</span>`);
  return t;
}

function scrollBot(instant=false){
  const w=g('msgs-scroll');
  if(instant)w.scrollTop=w.scrollHeight;
  else w.scrollTo({top:w.scrollHeight,behavior:'smooth'});
}
function isNearBot(){const w=g('msgs-scroll');return w.scrollHeight-w.scrollTop-w.clientHeight<160;}
function scrollToMsg(id){
  const el=document.querySelector(`[data-mid="${id}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--snap)';setTimeout(()=>el.style.outline='',1500);}
}
function updateTab(){
  const total=Object.values(unread).reduce((a,b)=>a+b,0);
  document.title=total>0?`(${total}) VIBE ✦`:'VIBE ✦';
}

// ═══════════════════════════════════════════════════════
//  SEND / EDIT / DELETE / PIN / REACT
// ═══════════════════════════════════════════════════════
function sendMsg(){
  const ta=g('msg-ta');
  const text=ta.value.trim();
  if(!text||!currentRoom||!ws||ws.readyState!==1)return;
  if(text.length>MAX_MSG)return showToast(`Too long (${text.length}/${MAX_MSG})`,'error');
  const payload={text};
  if(replyingTo)payload.replyTo=replyingTo.id;
  if(currentRoom.type==='channel') ws.send(JSON.stringify({type:'message',roomId:currentRoom.id,...payload}));
  else ws.send(JSON.stringify({type:'dm',toUserId:currentRoom.toUserId,...payload}));
  ta.value='';autoResize(ta);cancelReply();stopTyping();updateCharCnt('');
  // XP
  gainXP(XP_PER_MSG,'msg');
}
function openEdit(id,text){

function sendTyping(){
  if(!ws||ws.readyState!==1||!currentRoom)return;
  if(!isTyping){

    const p=currentRoom.type==='channel'?{type:'typing',roomId:currentRoom.id}:{type:'typing',isDm:true,toUserId:currentRoom.toUserId};

function renderTyping(){
  const bar=g('typing-row');

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
  if(e.key==='Escape')cancelReply();
}
function onTaChange(){
  const ta=g('msg-ta');autoResize(ta);sendTyping();updateCharCnt(ta.value);
}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
function updateCharCnt(text){
  const cc=g('char-cnt');const len=text.length;
  if(len<1700){cc.style.display='none';return;}
  cc.style.display='';cc.textContent=`${len}/${MAX_MSG}`;
  cc.className='char-cnt'+(len>MAX_MSG?' over':len>1900?' warn':'');
}

function triggerFile(){g('file-input').click();}
function handleImg(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>5*1024*1024)return showToast('Image too large (max 5MB)','error');
  const reader=new FileReader();
  reader.onload=ev=>{
    const ta=g('msg-ta');ta.value+=`\n[img:${ev.target.result}]`;autoResize(ta);
    showToast('📎 Image attached! Send to share it.','info');
  };
  reader.readAsDataURL(file);e.target.value='';
}

async function searchGifs(q2){
  const grid=g('gif-grid');
  grid.innerHTML='<div style="color:var(--t3);font-size:12px;text-align:center;padding:16px;grid-column:1/-1;">Searching…</div>';
  try{

    const data=await res.json();

      return `<div class="gif-cell" onclick="sendGif('${esc(url)}')"><img src="${esc(thumb)}" loading="lazy"/></div>`;
    }).join('');
  }catch{grid.innerHTML='<div style="color:var(--t3);font-size:12px;text-align:center;padding:16px;grid-column:1/-1;">Could not load GIFs</div>';}
}

  else ws.send(JSON.stringify({type:'dm',toUserId:currentRoom.toUserId,text}));

  gainXP(XP_PER_MSG,'msg');
}

    </div>`;

function shopTab(tab){
  currentShopTab=tab;
  document.querySelectorAll('.shop-tab').forEach((b,i)=>{

    b.classList.toggle('on',tabs[i]===tab);

function renderShopGrid(tab){
  const grid=g('shop-grid');
  const items=SHOP[tab]||[];
  grid.innerHTML=items.map(item=>{
    const owned=!!myInventory[item.id];
    const equipped=Object.values(myEquipped).includes(item.id);
    return `<div class="shop-card ${owned?'owned':''}" onclick="buyOrEquip('${item.id}','${tab}')">
      ${item.isNew?`<div class="shop-new-tag">NEW</div>`:''}
      <div class="shop-preview ${item.preview}"><span style="font-size:32px;">${item.emoji}</span></div>
      <div class="shop-item-name">${esc(item.name)}</div>

      <div class="shop-buy">
        ${owned
          ?(equipped?'✓ Equipped':'✓ Equip')
          :`⭐ ${item.cost} credits`}
      </div>
    </div>`;
  }).join('');
}
function buyOrEquip(itemId,tab){
  const item=[...SHOP.tags,...SHOP.banners,...SHOP.avatars,...SHOP.titles].find(i=>i.id===itemId);
  if(!item)return;
  if(myInventory[itemId]){
    // Equip
    const slotMap={tag:'tag',banner:'banner',avatar:'avatar',title:'title'};
    const slot=slotMap[item.type]||item.type;
    if(Object.values(myEquipped).includes(itemId)){
      delete myEquipped[slot];saveLocalXP();showToast('Unequipped '+item.name,'info');
    } else {
      myEquipped[slot]=itemId;saveLocalXP();showToast('Equipped '+item.name+' ✦','success');
    }
    renderShopGrid(tab);
    return;
  }
  // Buy confirm
  pendingBuy={item,tab};
  g('buy-title').textContent='Purchase '+item.name;
  g('buy-preview').innerHTML=`<div class="shop-preview ${item.preview}" style="height:80px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;">${item.emoji}</div>`;
  g('buy-desc').textContent=item.desc;
  g('buy-cost').innerHTML=`⭐ ${item.cost} credits`;
  openModal('modal-buy');
}
function confirmPurchase(){
  if(!pendingBuy)return;
  const {item,tab}=pendingBuy;
  if(myCredits<item.cost)return showToast('Not enough credits! Chat more to earn credits 💬','error');
  myCredits-=item.cost;
  myInventory[item.id]=true;
  saveLocalXP();
  updateXPBar();
  closeModal('modal-buy');
  showToast(`Bought ${item.name} 🎉 Check ur profile!`,'success');
  renderShopGrid(tab);
  pendingBuy=null;
}

// ═══════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function addNotif(notif){
  storedNotifs.unshift(notif);
  if(storedNotifs.length>50)storedNotifs.pop();
  unreadNotifCount++;
  updateNotifBadge();
  showInAppBanner(notif);
  if(shouldDesktopNotif()) sendDesktopNotif(notif.title,notif.body,notif.icon,notif.data);
}
function updateNotifBadge(){
  const badge=g('rail-notif-badge');
  const topBadge=g('notif-count');
  if(unreadNotifCount>0){
    badge.style.display='';badge.textContent=unreadNotifCount>9?'9+':unreadNotifCount;
    topBadge.style.display='';topBadge.textContent=unreadNotifCount>9?'9+':unreadNotifCount;
  } else {
    badge.style.display='none';
    topBadge.style.display='none';
  }
}
function renderNotifsView(){
  const inner=g('notif-view-inner');
  if(!storedNotifs.length){inner.innerHTML='<div style="font-size:13px;color:var(--t3);text-align:center;padding:40px;">No notifications yet 📭</div>';return;}
  inner.innerHTML=storedNotifs.map((n,i)=>`
    <div class="notif-card ${i<unreadNotifCount?'unread':''}" onclick="handleNotifClick('${esc(JSON.stringify(n).replace(/'/g,"\\'"))}')">
      ${n.icon?`<div class="notif-av"><img src="${esc(n.icon)}" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=ghost'"/></div>`:'<div style="width:36px;height:36px;background:var(--void3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${n.emoji||'🔔'}</div>'}
      <div class="notif-text">
        <div class="notif-title">${esc(n.title)}</div>
        <div class="notif-body">${esc(n.body)}</div>
        <div class="notif-time">${formatTime(n.ts)}</div>
      </div>
      ${i<unreadNotifCount?`<div class="notif-unread-dot"></div>`:''}
    </div>`).join('');
}
function handleNotifClick(jsonStr){
  try{
    const n=JSON.parse(jsonStr);
    if(n.data?.roomId){const r=rooms.find(x=>x.id===n.data.roomId);if(r)openChannel(r);}
    if(n.data?.dmUserId){const u=allUsers.find(x=>x.id===n.data.dmUserId);if(u)openDMUser(u);}
  }catch{}
}
function showInAppBanner(notif){
  const stack=g('notif-stack');
  const el=document.createElement('div');
  el.className='notif-banner';
  el.innerHTML=`
    <div class="nb-av"><img src="${esc(notif.icon||'')}" onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=ghost'"/></div>
    <div class="nb-body">
      <div class="nb-title">${esc(notif.title)}</div>
      <div class="nb-msg">${esc(notif.body)}</div>
    </div>
    <button class="nb-close" onclick="event.stopPropagation();this.closest('.notif-banner').remove()">✕</button>`;
  el.onclick=()=>{handleNotifClick(JSON.stringify(notif));el.remove();};
  stack.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},5000);
}
function shouldDesktopNotif(){return 'Notification' in window && Notification.permission==='granted';}
function sendDesktopNotif(title,body,icon,data={}){
  if(!shouldDesktopNotif())return;
  if(document.visibilityState==='visible')return;
  try{
    const n=new Notification(title,{body,icon,tag:'vibe'});
    n.onclick=()=>{window.focus();n.close();};
  }catch(err){
    if(swReg?.active) swReg.active.postMessage({type:'notify',title,body,icon,data});
  }
}

// ═══════════════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════════════
function connectWS(){
  if(ws){try{ws.close();}catch{}}
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token}));
  ws.onclose=()=>setTimeout(()=>{if(token)connectWS();},3000);
  ws.onerror=()=>{};
  ws.onmessage=e=>{try{handleWS(JSON.parse(e.data));}catch{}};
}
function handleWS(data){
  switch(data.type){
    case 'auth_ok': break;
    case 'online_users':
      onlineIds=new Set(data.userIds);
      renderRightPanel();renderDMsList();renderStories();
      break;
    case 'user_online':
      onlineIds.add(data.userId);
      renderRightPanel();renderDMsList();renderStories();
      addNotif({title:`${data.username} is online 👀`,body:'Say hi!',icon:'',emoji:'🟢',ts:Date.now(),data:{}});
      break;
    case 'user_offline':
      onlineIds.delete(data.userId);
      renderRightPanel();renderDMsList();renderStories();
      break;
    case 'message': {
      const msg=data.message;
      const inView=currentRoom?.type==='channel'&&currentRoom.id===msg.roomId&&document.getElementById('view-chat').classList.contains('on');
      if(inView){
        const nb=isNearBot();renderMsg(msg);if(nb||msg.user?.id===currentUser?.id)scrollBot();
      } else {
        unread[msg.roomId]=(unread[msg.roomId]||0)+1;
        renderChannelsList();updateTab();
        if(msg.user?.id!==currentUser?.id){
          const u=msg.user;
          addNotif({
            title:`#${msg.roomId} — ${u?.displayName||'?'}`,
            body:msg.text?.slice(0,80)||'',
            icon:u?.avatar||'',
            emoji:'💬',
            ts:Date.now(),
            data:{roomId:msg.roomId}
          });
        }
      }
      break;
    }
    case 'dm': {
      const msg=data.message;
      const theirId=msg.userId===currentUser?.id?msg.toUserId:msg.userId;
      const inView=currentRoom?.type==='dm'&&currentRoom.toUserId===theirId&&document.getElementById('view-chat').classList.contains('on');
      if(inView){
        const nb=isNearBot();renderMsg(msg);if(nb||msg.user?.id===currentUser?.id)scrollBot();
      } else if(msg.userId!==currentUser?.id){
        const dmId='dm:'+theirId;
        unread[dmId]=(unread[dmId]||0)+1;
        renderDMsList();updateTab();
        const u=data.fromUser||msg.user;
        addNotif({
          title:`💬 ${u?.displayName||'Someone'} DMed you`,
          body:msg.text?.slice(0,80)||'',
          icon:u?.avatar||'',
          emoji:'💬',
          ts:Date.now(),
          data:{dmUserId:theirId}
        });
      }
      break;
    }
    case 'message_edited': {
      const el=document.querySelector(`[data-mid="${data.messageId}"] .bubble`);
      if(el){
        // Find text node
        const textParts=el.innerHTML.split('<div class="bubble-media">');
        if(textParts.length>1){el.innerHTML=renderText(data.text||'')+el.innerHTML.slice(el.innerHTML.indexOf('<div class="bubble-media">'));}
        else el.innerHTML=renderText(data.text||'');
      }
      break;
    }
    case 'message_deleted': {
      const el=document.querySelector(`[data-mid="${data.messageId}"]`);
      if(el){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);}
      break;
    }
    case 'message_pinned': {
      const row=document.querySelector(`[data-mid="${data.messageId}"]`);
      if(row){
        const bwrap=row.querySelector('.msg-bubble-wrap');
        const existing=bwrap?.querySelector('.pinned-flag');
        if(data.pinned&&!existing) bwrap?.insertAdjacentHTML('afterbegin','<div class="pinned-flag">📌 Pinned</div>');
        else if(!data.pinned&&existing) existing.remove();
      }
      break;
    }
    case 'reaction_update': {
      const rxDiv=document.querySelector(`[data-rxid="${data.messageId}"]`);
      if(rxDiv)rxDiv.innerHTML=buildRx(data.messageId,data.reactions||{});
      break;
    }
    case 'typing': {
      if(data.userId===currentUser?.id)break;
      const key=data.isDm?`dm:${data.toUserId===currentUser?.id?data.userId:data.toUserId}`:data.roomId;
      if(!typingMap[key])typingMap[key]={};
      if(typingMap[key][data.userId])clearTimeout(typingMap[key][data.userId]);
      typingMap[key][data.userId]=setTimeout(()=>{delete typingMap[key][data.userId];renderTyping();},4000);
      renderTyping();
      break;
    }
    case 'room_created':
      rooms.push(data.room);renderChannelsList();
      addNotif({title:'New channel: #'+data.room.name,body:data.room.description||'',emoji:'🎉',ts:Date.now(),data:{roomId:data.room.id}});
      break;
    case 'room_deleted':
      rooms=rooms.filter(r=>r.id!==data.roomId);renderChannelsList();
      if(currentRoom?.id===data.roomId){switchView('home');currentRoom=null;showToast('Channel was deleted','error');}
      break;
    case 'error': showToast(data.message,'error'); break;
  }
}

// ═══════════════════════════════════════════════════════
//  ROOM CREATION
// ═══════════════════════════════════════════════════════
function openNewRoomModal(){openModal('modal-new-room');g('nr-name').focus();}
function sanitize(el){el.value=el.value.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-');}
async function createRoom(){
  const name=g('nr-name').value.trim(),desc=g('nr-desc').value.trim();
  if(!name)return showToast('Channel name required','error');
  try{
    await apiFetch('/api/rooms','POST',{name,description:desc});
    closeModal('modal-new-room');g('nr-name').value='';g('nr-desc').value='';
    showToast(`#${name} created 🔥`,'success');
  }catch(e){showToast(e.message,'error');}
}

// ═══════════════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════════════
function openModal(id){document.getElementById(id).classList.add('on');}
function closeModal(id){document.getElementById(id).classList.remove('on');}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))e.target.classList.remove('on');});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.querySelectorAll('.modal-bg.on').forEach(m=>m.classList.remove('on'));cancelReply();}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}
  if(e.key==='Enter'&&!e.target.closest('#chat-screen')){
    if(!g('form-login').style.display||g('form-login').style.display==='')doLogin();
    else doSignup();
  }
});

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg,type=''){
  const tc=g('toasts');
  const el=document.createElement('div');
  const icon={error:'❌',success:'✅',info:'💡',level:'',credit:'💰','':''}[type]||'💬';
  el.className='toast '+(type||'');
  el.innerHTML=`<span>${icon}</span><span>${esc(msg)}</span>`;
  tc.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},4000);
}

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function g(id){return document.getElementById(id);}
function esc(s){
  if(s==null)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
async function apiFetch(path,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token)opts.headers['Authorization']='Bearer '+token;
  if(body)opts.body=JSON.stringify(body);
  let res;
  try{res=await fetch(API+path,opts);}
  catch{throw new Error('Network error — is the server running?');}
  const ct=res.headers.get('content-type')||'';
  let data;
  if(ct.includes('application/json')){try{data=await res.json();}catch{data={};}}
  else{const text=await res.text().catch(()=>'');if(!res.ok)throw new Error(`Server error ${res.status}`);return text;}
  if(!res.ok)throw new Error(data.error||`Request failed (${res.status})`);
  return data;
}
function formatTime(ts){
  const d=new Date(ts),now=new Date();
  const today=d.toDateString()===now.toDateString();
  const yest=d.toDateString()===new Date(Date.now()-86400000).toDateString();
  if(today)return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(yest)return 'Yesterday '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// Auth enter key
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||g('auth-screen').style.display==='none')return;
  if(!g('form-login').style.display||g('form-login').style.display!=='none')doLogin();
  else doSignup();
});
