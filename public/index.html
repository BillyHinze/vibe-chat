<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VIBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--surface:#1e1e27;--surface2:#252530;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --text:#f0f0f8;--text2:#9090b0;--text3:#50507a;
  --accent:#FF6B35;--accent2:#FFFC00;
  --green:#22c55e;--red:#ef4444;--purple:#a855f7;--teal:#06b6d4;--pink:#ec4899;
  --grad:linear-gradient(135deg,#FF6B35,#ff2d9e,#a855f7);
  --owner1:#FFFC00;--owner2:#FF6B35;--owner3:#ff2d9e;--owner4:#a855f7;--owner5:#06b6d4;
  --r:20px;--r-sm:12px;--r-xs:8px;
  --font:'Plus Jakarta Sans',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px;}

#app{width:100%;height:100%;display:flex;flex-direction:column;}

/* LOADING */
#loading-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#loading-screen.hide{animation:fadeOut 0.35s ease forwards;}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.loading-logo{font-size:56px;font-weight:900;letter-spacing:-3px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.loading-sub{font-size:11px;color:var(--text3);letter-spacing:0.15em;text-transform:uppercase;font-weight:600;}
.loading-dots{display:flex;gap:6px;}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotPulse 1.4s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:0.2s;background:var(--pink);}
.loading-dots span:nth-child(3){animation-delay:0.4s;background:var(--purple);}
@keyframes dotPulse{0%,60%,100%{transform:scale(0.6);opacity:0.4;}30%{transform:scale(1);opacity:1;}}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100%;position:relative;overflow:hidden;}
.auth-glow{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.auth-glow::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,0.15),transparent 70%);top:-200px;right:-150px;animation:glowDrift 8s ease-in-out infinite alternate;}
.auth-glow::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.12),transparent 70%);bottom:-150px;left:-100px;animation:glowDrift 10s ease-in-out infinite alternate-reverse;}
@keyframes glowDrift{from{transform:translate(0,0);}to{transform:translate(30px,40px);}}
.auth-card{position:relative;z-index:1;width:min(400px,calc(100% - 32px));padding:36px 28px;}
.auth-logo{font-size:48px;font-weight:900;letter-spacing:-3px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;text-align:center;margin-bottom:6px;}
.auth-tagline{text-align:center;color:var(--text3);font-size:13px;margin-bottom:28px;font-weight:500;}
.auth-tabs{display:flex;background:var(--bg3);border-radius:var(--r-sm);padding:4px;margin-bottom:20px;gap:4px;}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text3);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;border-radius:8px;transition:all 0.2s;}
.auth-tab.active{background:var(--surface2);color:var(--text);}
.form-group{margin-bottom:13px;}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.1em;}
.form-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:13px 15px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:all 0.2s;-webkit-appearance:none;}
.form-input:focus{border-color:var(--accent);background:var(--surface);}
.form-input::placeholder{color:var(--text3);}
.btn-primary{width:100%;padding:15px;background:var(--grad);border:none;border-radius:var(--r-sm);color:white;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;transition:all 0.2s;}
.btn-primary:active{transform:scale(0.98);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.auth-error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r-xs);padding:10px 14px;color:#fca5a5;font-size:13px;margin-bottom:10px;display:none;}
.auth-error.show{display:block;animation:shake 0.3s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

/* CHAT SCREEN */
#chat-screen{display:none;width:100%;height:100%;flex-direction:column;}
#chat-screen.active{display:flex;}
#screen-container{flex:1;overflow:hidden;display:flex;flex-direction:column;margin-bottom:calc(58px + var(--safe-bottom));}

/* TAB NAV */
.tab-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,15,0.96);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:6px 0 calc(6px + var(--safe-bottom));height:calc(58px + var(--safe-bottom));}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;border:none;background:none;cursor:pointer;color:var(--text3);transition:all 0.2s;border-radius:12px;min-width:52px;position:relative;}
.tab-btn.active{color:var(--accent);}
.tab-btn-icon{font-size:21px;line-height:1;transition:transform 0.2s;}
.tab-btn.active .tab-btn-icon{transform:scale(1.1);}
.tab-btn-label{font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
.tab-unread{position:absolute;top:1px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);}

/* TOP BAR */
.top-bar{display:flex;align-items:center;padding:14px 16px 10px;gap:12px;flex-shrink:0;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.top-bar-title{font-size:20px;font-weight:900;letter-spacing:-0.5px;flex:1;}
.top-bar-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all 0.15s;}
.icon-btn:active{background:var(--surface);transform:scale(0.9);}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);}
.ws-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green);}
.ws-dot.reconnecting{background:#f59e0b;animation:wsBlink 0.7s ease-in-out infinite;}
@keyframes wsBlink{0%,100%{opacity:1;}50%{opacity:0.2;}}

/* SCREENS */
#screen-chats,#screen-channels,#screen-people,#screen-profile{display:none;flex-direction:column;height:100%;overflow:hidden;}
#screen-chats.active,#screen-channels.active,#screen-people.active,#screen-profile.active{display:flex;}

/* STORIES */
.stories-row{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.stories-row::-webkit-scrollbar{display:none;}
.story-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:var(--grad);}
.story-ring.add{background:var(--bg3);border:2px dashed var(--border2);}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg);display:block;}
.story-name{font-size:10px;font-weight:600;color:var(--text2);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}

/* CHATS LIST */
.chats-list{flex:1;overflow-y:auto;}
.list-section-header{padding:10px 16px 4px;font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;}
.chat-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:background 0.1s;}
.chat-item:active{background:var(--bg3);}
.chat-item-av{position:relative;flex-shrink:0;width:52px;height:52px;}
.chat-item-av img{width:52px;height:52px;border-radius:50%;object-fit:cover;}
.chat-item-av .ch-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.chat-item-info{flex:1;min-width:0;}
.chat-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.chat-item-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item-time{font-size:11px;color:var(--text3);flex-shrink:0;margin-left:8px;}
.chat-item-preview{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item-preview.unread{color:var(--text2);font-weight:600;}
.unread-pill{background:var(--accent);color:white;border-radius:99px;font-size:10px;font-weight:800;padding:2px 7px;flex-shrink:0;margin-left:6px;}

/* CHANNEL LIST */
.channel-row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background 0.1s;}
.channel-row:active{background:var(--bg3);}
.ch-icon{border-radius:14px;}
.ch-gen{background:linear-gradient(135deg,#FF6B35,#ff2d9e);}
.ch-ran{background:linear-gradient(135deg,#a855f7,#06b6d4);}
.ch-gam{background:linear-gradient(135deg,#22c55e,#06b6d4);}
.ch-mus{background:linear-gradient(135deg,#FFFC00,#FF6B35);}
.ch-def{background:linear-gradient(135deg,#6366f1,#a855f7);}
.channel-info{flex:1;min-width:0;}
.channel-name{font-size:15px;font-weight:700;}
.channel-desc{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge-num{background:var(--accent);color:white;border-radius:99px;font-size:10px;font-weight:800;padding:2px 7px;}

/* PEOPLE */
.people-search{padding:10px 16px;flex-shrink:0;}
.people-search-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:24px;padding:10px 16px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;}
.people-search-input::placeholder{color:var(--text3);}
.people-list{flex:1;overflow-y:auto;}
.person-row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;}
.person-row:active{background:var(--bg3);}
.person-av{position:relative;flex-shrink:0;width:50px;height:50px;}
.person-av img{width:50px;height:50px;border-radius:50%;object-fit:cover;}
.person-info{flex:1;min-width:0;}
.person-name{font-size:15px;font-weight:700;}
.person-user{font-size:12px;color:var(--text3);}
.person-bio{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.dm-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:7px 13px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;}
.dm-btn:active{background:var(--surface);color:var(--accent);}

/* STATUS DOT */
.sdot{position:absolute;border-radius:50%;border:2.5px solid var(--bg);z-index:2;}
.sdot.online{background:var(--green);}
.sdot.away{background:#f59e0b;}
.sdot.dnd{background:var(--red);}
.sdot.offline{background:var(--text3);}

/* PROFILE SCREEN */
.profile-scroll{flex:1;overflow-y:auto;}
.profile-cover{height:160px;background:var(--grad);position:relative;overflow:hidden;}
.cover-glow{position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,0.1),transparent 60%),radial-gradient(circle at 75% 30%,rgba(255,252,0,0.15),transparent 50%);animation:coverMove 6s ease-in-out infinite alternate;}
@keyframes coverMove{from{transform:scale(1);}to{transform:scale(1.05);}}
.cover-crown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;opacity:0.12;animation:crownFloat 3s ease-in-out infinite;}
@keyframes crownFloat{0%,100%{transform:translate(-50%,-50%) rotate(-4deg);}50%{transform:translate(-50%,-58%) rotate(4deg);}}
.profile-av-row{padding:0 20px;margin-top:-44px;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.profile-av-ring{width:88px;height:88px;border-radius:50%;padding:3px;background:var(--grad);}
.profile-av-ring.owner-ring{background:linear-gradient(90deg,var(--owner1),var(--owner2),var(--owner3),var(--owner4),var(--owner5));animation:ownerGrad 3s linear infinite;background-size:300%;}
@keyframes ownerGrad{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.profile-av-ring img{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);display:block;object-fit:cover;}
.profile-edit-btn{background:var(--bg3);border:1.5px solid var(--border2);border-radius:20px;padding:8px 16px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text);cursor:pointer;margin-bottom:4px;}
.profile-edit-btn:active{border-color:var(--accent);color:var(--accent);}
.pinfo{padding:0 20px 16px;}
.pname{font-size:22px;font-weight:900;letter-spacing:-0.5px;margin-bottom:2px;}
.pusername{font-size:13px;color:var(--text3);margin-bottom:8px;}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pbadge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;}
.pb-owner{background:rgba(255,107,53,0.12);border:1px solid rgba(255,107,53,0.3);color:var(--accent);}
.pb-crown{background:rgba(255,252,0,0.1);border:1px solid rgba(255,252,0,0.3);color:#f59e0b;}
.pb-founder{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);color:var(--purple);}
.pb-member{background:rgba(6,182,212,0.08);border:1px solid rgba(6,182,212,0.25);color:var(--teal);}
.pbio{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:12px;}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--r-sm);overflow:hidden;}
.stat-cell{background:var(--bg3);padding:13px 0;text-align:center;}
.stat-n{font-size:19px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-l{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.07em;margin-top:2px;}
.psection{padding:16px 20px 0;}
.psec-title{font-size:12px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;}
.billy-perks{background:linear-gradient(135deg,rgba(255,107,53,0.07),rgba(168,85,247,0.07));border:1px solid rgba(255,107,53,0.18);border-radius:var(--r-sm);padding:14px;margin-bottom:0;}
.billy-perks-title{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
.perks-grid{display:flex;flex-wrap:wrap;gap:6px;}
.perk{display:inline-flex;align-items:center;gap:4px;background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.2);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--accent);}
.pf-group{margin-bottom:13px;}
.pf-label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
.pf-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;-webkit-appearance:none;}
.pf-input:focus{border-color:var(--accent);}
.pf-input::placeholder{color:var(--text3);}
.pf-save{width:100%;padding:14px;background:var(--grad);border:none;border-radius:var(--r-sm);color:white;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;margin-top:4px;}
.pf-save:active{transform:scale(0.98);}
.status-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sopt{background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:11px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.sopt.sel{border-color:var(--accent);background:rgba(255,107,53,0.07);}
.logout-btn{width:100%;padding:13px;background:rgba(239,68,68,0.07);border:1.5px solid rgba(239,68,68,0.2);border-radius:var(--r-sm);color:#fca5a5;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;}

/* OWNER NAME */
@keyframes oGrad{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.owner-name{background:linear-gradient(90deg,var(--owner1),var(--owner2),var(--owner3),var(--owner4),var(--owner5));background-size:300% 100%;animation:oGrad 2s linear infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;}
.owner-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;position:relative;background:var(--bg);color:white;animation:oGlow 3s ease-in-out infinite;}
.owner-badge::before{content:'';position:absolute;inset:-1.5px;border-radius:99px;background:linear-gradient(90deg,var(--owner1),var(--owner2),var(--owner3),var(--owner4),var(--owner5),var(--owner1));background-size:300% 100%;animation:oGrad 2s linear infinite;z-index:-1;}
@keyframes oGlow{0%,100%{box-shadow:0 0 8px rgba(255,107,53,0.4);}50%{box-shadow:0 0 20px rgba(168,85,247,0.6);}}
.owner-av-border{position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(90deg,var(--owner1),var(--owner2),var(--owner3),var(--owner4),var(--owner5));animation:oGrad 2s linear infinite;background-size:300%;z-index:0;}

/* CHAT VIEW */
#screen-chat-view{display:none;flex-direction:column;height:100%;position:fixed;inset:0;z-index:100;background:var(--bg);}
#screen-chat-view.open{display:flex;}
.cv-header{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.back-btn{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.cv-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.cv-info{flex:1;min-width:0;}
.cv-name{font-size:16px;font-weight:800;letter-spacing:-0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cv-sub{font-size:11px;color:var(--text3);}
.cv-actions{display:flex;gap:4px;}

/* MESSAGES */
.messages-area{flex:1;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;}
.day-sep{text-align:center;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin:10px 0;position:relative;}
.day-sep span{background:var(--bg);padding:0 10px;position:relative;z-index:1;}
.day-sep::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border);}

.msg-wrap{display:flex;align-items:flex-end;gap:7px;margin:2px 0;animation:msgPop 0.2s cubic-bezier(0.175,0.885,0.32,1.275);}
@keyframes msgPop{from{opacity:0;transform:scale(0.88) translateY(6px);}to{opacity:1;transform:none;}}
.msg-wrap.mine{flex-direction:row-reverse;}
.msg-wrap.cont .bav{visibility:hidden;}
.bav{width:26px;height:26px;border-radius:50%;flex-shrink:0;overflow:visible;position:relative;margin-bottom:2px;}
.bav img{width:26px;height:26px;border-radius:50%;object-fit:cover;position:relative;z-index:1;display:block;}
.bcol{display:flex;flex-direction:column;max-width:74%;}
.msg-wrap.mine .bcol{align-items:flex-end;}
.bname{font-size:10px;font-weight:700;color:var(--text3);padding:0 8px;margin-bottom:1px;}
.bubble{padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;background:var(--bg3);color:var(--text);border-bottom-left-radius:5px;position:relative;cursor:pointer;}
.msg-wrap.mine .bubble{background:var(--grad);color:white;border-bottom-right-radius:5px;border-bottom-left-radius:18px;}
.bubble.cont{border-top-left-radius:5px;}
.msg-wrap.mine .bubble.cont{border-top-right-radius:5px;border-top-left-radius:18px;}
.breply{background:rgba(255,255,255,0.07);border-left:3px solid var(--accent);border-radius:7px;padding:5px 9px;margin-bottom:5px;font-size:11.5px;cursor:pointer;}
.msg-wrap.mine .breply{background:rgba(0,0,0,0.18);border-left-color:rgba(255,255,255,0.5);}
.breply-name{font-weight:700;color:var(--accent);margin-bottom:1px;font-size:11px;}
.msg-wrap.mine .breply-name{color:rgba(255,255,255,0.85);}
.breply-text{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-wrap.mine .breply-text{color:rgba(255,255,255,0.65);}
.bmeta{display:flex;align-items:center;gap:4px;padding:0 4px;margin-top:1px;}
.msg-wrap.mine .bmeta{flex-direction:row-reverse;}
.btime{font-size:10px;color:var(--text3);}
.bedited{font-size:10px;color:var(--text3);font-style:italic;}
.breacts{display:flex;flex-wrap:wrap;gap:3px;padding:2px 4px;}
.rpill{display:inline-flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:2px 7px;font-size:12px;cursor:pointer;user-select:none;}
.rpill:active{transform:scale(0.9);}
.rpill.mine{background:rgba(255,107,53,0.15);border-color:rgba(255,107,53,0.4);}
.rcount{font-size:10px;font-weight:700;color:var(--text2);}
.bubble code{font-family:monospace;font-size:12px;background:rgba(0,0,0,0.2);border-radius:3px;padding:1px 4px;}
.bubble pre{font-family:monospace;font-size:12px;background:rgba(0,0,0,0.25);border-radius:7px;padding:9px 11px;margin:4px 0;overflow-x:auto;white-space:pre;}

/* PINNED BAR */
.pinned-bar{background:rgba(255,107,53,0.06);border-bottom:1px solid rgba(255,107,53,0.15);padding:8px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;}
.pb-text{flex:1;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pb-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;}

/* TYPING */
.typing-row{min-height:18px;padding:2px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.typing-bub{display:flex;align-items:center;gap:4px;background:var(--bg3);border-radius:13px;padding:5px 11px;}
.tdots{display:flex;gap:3px;}
.tdots span{width:4px;height:4px;border-radius:50%;background:var(--text3);animation:tBounce 1.2s ease-in-out infinite;}
.tdots span:nth-child(2){animation-delay:0.15s;}
.tdots span:nth-child(3){animation-delay:0.3s;}
@keyframes tBounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}
.tname{font-size:11px;color:var(--text3);}

/* REPLY BAR */
.reply-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--bg3);border-top:1px solid var(--border);flex-shrink:0;}
.rbar-content{flex:1;min-width:0;}
.rbar-name{font-size:11px;font-weight:700;color:var(--accent);}
.rbar-text{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rbar-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;}

/* INPUT */
.input-row{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(8px + var(--safe-bottom));background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0;}
.input-pill{flex:1;display:flex;align-items:flex-end;gap:2px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:24px;padding:5px 12px 5px 8px;transition:border-color 0.2s;}
.input-pill:focus-within{border-color:rgba(255,107,53,0.4);}
.emoji-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:3px;line-height:1;flex-shrink:0;color:var(--text3);}
.emoji-btn:active{transform:scale(1.2);}
.msg-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:15px;outline:none;resize:none;padding:4px 4px;max-height:120px;line-height:1.4;}
.msg-input::placeholder{color:var(--text3);}
.attach-btn{background:none;border:none;font-size:17px;cursor:pointer;padding:3px;line-height:1;flex-shrink:0;color:var(--text3);}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--grad);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all 0.2s;}
.send-btn:active{transform:scale(0.9);}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;}

/* SCROLL BTN */
#scroll-btn{position:absolute;bottom:76px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:20;}
#scroll-btn.visible{display:flex;}

/* SEARCH PANEL */
.search-panel{padding:9px 14px;border-bottom:1px solid var(--border);display:none;flex-shrink:0;}
.search-panel.visible{display:block;}
.search-row{display:flex;gap:8px;}
.search-input{flex:1;background:var(--bg3);border:1.5px solid var(--border2);border-radius:20px;padding:8px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;}
.search-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px;}
.search-results{margin-top:7px;max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.sresult{padding:8px 10px;border-radius:8px;cursor:pointer;}
.sresult:active{background:var(--surface);}
.sresult-meta{font-size:10.5px;color:var(--text3);margin-bottom:2px;}
.sresult-text{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sresult-text mark{background:rgba(255,107,53,0.3);color:var(--text);border-radius:2px;padding:0 2px;}

/* CONTEXT MENU */
.msg-ctx{position:fixed;z-index:500;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px;box-shadow:0 12px 40px rgba(0,0,0,0.5);display:none;min-width:155px;animation:ctxIn 0.15s ease;}
@keyframes ctxIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:none;}}
.msg-ctx.show{display:block;}
.ctx-reacts{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.ctx-emoji{background:none;border:none;font-size:21px;cursor:pointer;padding:4px 5px;border-radius:7px;}
.ctx-emoji:active{background:var(--surface);transform:scale(1.2);}
.ctx-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);}
.ctx-item:active{background:var(--surface);}
.ctx-item.danger{color:var(--red);}
.ctx-icon{font-size:15px;width:18px;text-align:center;}

/* EMOJI SHEET */
.emoji-overlay{position:fixed;inset:0;z-index:599;display:none;}
.emoji-overlay.open{display:block;}
.emoji-sheet{position:fixed;bottom:0;left:0;right:0;z-index:600;background:var(--bg3);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;padding:0 0 calc(20px + var(--safe-bottom));max-height:380px;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);}
.emoji-sheet.open{transform:translateY(0);}
.esh-handle{width:40px;height:4px;border-radius:99px;background:var(--border2);margin:12px auto 10px;}
.esh-search{margin:0 12px 8px;background:var(--surface2);border:none;border-radius:20px;padding:8px 16px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:calc(100% - 24px);}
.esh-search::placeholder{color:var(--text3);}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:0 8px;overflow-y:auto;flex:1;}
.egrid-btn{background:none;border:none;font-size:24px;padding:6px;border-radius:9px;cursor:pointer;line-height:1;text-align:center;}
.egrid-btn:active{background:var(--surface2);transform:scale(1.2);}

/* MODALS */
.modal-overlay{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:var(--bg3);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:0 0 calc(20px + var(--safe-bottom));animation:sheetUp 0.3s cubic-bezier(0.32,0.72,0,1);}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.msh-handle{width:40px;height:4px;border-radius:99px;background:var(--border2);margin:12px auto 16px;}
.msh-title{font-size:18px;font-weight:900;padding:0 20px;margin-bottom:14px;}
.msh-body{padding:0 20px;}
.msh-foot{padding:14px 20px 0;display:flex;gap:8px;}
.btn-ghost{flex:1;padding:13px;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r-sm);color:var(--text2);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;}
.btn-confirm{flex:1;padding:13px;background:var(--grad);border:none;border-radius:var(--r-sm);color:white;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;}
.btn-confirm:active{transform:scale(0.98);}
/* Edit modal */
.modal-center{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;}
.modal-center.show{display:flex;}
.mbox{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:400px;padding:22px;animation:ctxIn 0.22s ease;}
.mbox-title{font-size:16px;font-weight:900;margin-bottom:14px;}
.mbox-input{width:100%;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:11px 13px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;resize:vertical;}
.mbox-input:focus{border-color:var(--accent);}
.mbox-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.bsm-ghost{padding:8px 16px;background:transparent;border:1px solid var(--border2);border-radius:var(--r-xs);color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;font-weight:600;}
.bsm-pri{padding:8px 18px;background:var(--grad);border:none;border-radius:var(--r-xs);color:white;font-family:var(--font);font-size:13px;font-weight:800;cursor:pointer;}

/* TOAST */
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(300px,calc(100% - 32px));}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 15px;font-size:13px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,0.5);animation:toastIn 0.28s cubic-bezier(0.175,0.885,0.32,1.275);font-weight:600;text-align:center;}
.toast.success{border-color:rgba(34,197,94,0.4);background:rgba(34,197,94,0.1);color:#86efac;}
.toast.error{border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.1);color:#fca5a5;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(0.95);}to{opacity:1;transform:none;}}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-state-icon{font-size:44px;margin-bottom:10px;}
.empty-state-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.empty-state-sub{font-size:13px;}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">VIBE</div>
  <div class="loading-sub">loading...</div>
  <div class="loading-dots"><span></span><span></span><span></span></div>
</div>
<div id="toast-container"></div>

<div id="app">

  <!-- AUTH -->
  <div id="auth-screen">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-logo">VIBE</div>
      <div class="auth-tagline">your crew, your rules 🔥</div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showAuthTab('login')">Log In</button>
        <button class="auth-tab" onclick="showAuthTab('signup')">Sign Up</button>
      </div>
      <div id="auth-error" class="auth-error"></div>
      <div id="login-form">
        <div class="form-group"><label class="form-label">Username</label><input type="text" id="login-username" class="form-input" placeholder="your username" autocomplete="username" autocorrect="off" autocapitalize="off"/></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password"/></div>
        <button class="btn-primary" onclick="doLogin()" id="login-btn">Let me in 🚀</button>
      </div>
      <div id="signup-form" style="display:none">
        <div class="form-group"><label class="form-label">Username</label><input type="text" id="signup-username" class="form-input" placeholder="make it cool" autocomplete="username" autocorrect="off" autocapitalize="off"/></div>
        <div class="form-group"><label class="form-label">Display Name</label><input type="text" id="signup-displayname" class="form-input" placeholder="how you appear"/></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="signup-password" class="form-input" placeholder="min 4 chars" autocomplete="new-password"/></div>
        <button class="btn-primary" onclick="doSignup()" id="signup-btn">Create Account →</button>
      </div>
    </div>
  </div>

  <!-- CHAT APP -->
  <div id="chat-screen">
    <div id="screen-container">

      <!-- CHATS -->
      <div id="screen-chats">
        <div class="top-bar">
          <div class="top-bar-title" id="chats-title">VIBE</div>
          <div class="top-bar-actions">
            <div class="ws-dot" id="ws-dot"></div>
            <button class="icon-btn" onclick="openNewRoomModal()">✏️</button>
          </div>
        </div>
        <div class="stories-row" id="stories-row">
          <div class="story-item" onclick="switchTab('profile')">
            <div class="story-ring add" id="my-story-ring"><img id="my-story-av" src="" alt=""/></div>
            <div class="story-name">You</div>
          </div>
        </div>
        <div class="chats-list" id="chats-list"></div>
      </div>

      <!-- CHANNELS -->
      <div id="screen-channels">
        <div class="top-bar">
          <div class="top-bar-title">Channels</div>
          <div class="top-bar-actions"><button class="icon-btn" onclick="openNewRoomModal()">➕</button></div>
        </div>
        <div style="flex:1;overflow-y:auto;" id="channels-list-screen"></div>
      </div>

      <!-- PEOPLE -->
      <div id="screen-people">
        <div class="top-bar"><div class="top-bar-title">People</div></div>
        <div class="people-search"><input class="people-search-input" id="people-search" placeholder="🔍  Search people..." oninput="filterPeople(this.value)"/></div>
        <div class="people-list" id="people-list"></div>
      </div>

      <!-- PROFILE -->
      <div id="screen-profile">
        <div class="profile-scroll" id="profile-scroll"></div>
      </div>

    </div>

    <nav class="tab-nav">
      <button class="tab-btn active" id="tab-chats" onclick="switchTab('chats')">
        <span class="tab-btn-icon">💬</span><span class="tab-btn-label">Chats</span>
        <div class="tab-unread" id="badge-chats" style="display:none;"></div>
      </button>
      <button class="tab-btn" id="tab-channels" onclick="switchTab('channels')">
        <span class="tab-btn-icon">#</span><span class="tab-btn-label">Channels</span>
        <div class="tab-unread" id="badge-channels" style="display:none;"></div>
      </button>
      <button class="tab-btn" id="tab-people" onclick="switchTab('people')">
        <span class="tab-btn-icon">👥</span><span class="tab-btn-label">People</span>
      </button>
      <button class="tab-btn" id="tab-profile" onclick="switchTab('profile')">
        <span class="tab-btn-icon">👤</span><span class="tab-btn-label">Profile</span>
      </button>
    </nav>

    <!-- CHAT VIEW -->
    <div id="screen-chat-view">
      <div class="cv-header">
        <button class="back-btn" onclick="closeChatView()">‹</button>
        <img class="cv-av" id="cv-av" src="" alt=""/>
        <div class="cv-info"><div class="cv-name" id="cv-name"></div><div class="cv-sub" id="cv-sub"></div></div>
        <div class="cv-actions">
          <button class="icon-btn" onclick="toggleSearch()">🔍</button>
          <button class="icon-btn" onclick="loadPins()">📌</button>
        </div>
      </div>
      <div class="search-panel" id="search-panel">
        <div class="search-row"><input class="search-input" id="search-input" placeholder="Search messages..." oninput="doSearch()"/><button class="search-close" onclick="toggleSearch()">✕</button></div>
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="pinned-bar" id="pinned-bar" style="display:none;">
        <span>📌</span><div class="pb-text" id="pb-text"></div>
        <button class="pb-close" onclick="document.getElementById('pinned-bar').style.display='none'">✕</button>
      </div>
      <div class="messages-area" id="messages-area"></div>
      <div class="typing-row" id="typing-row"></div>
      <button id="scroll-btn" onclick="scrollToBottom()">↓</button>
      <div class="reply-bar" id="reply-bar" style="display:none;">
        <span>↩️</span>
        <div class="rbar-content"><div class="rbar-name" id="rbar-name"></div><div class="rbar-text" id="rbar-text"></div></div>
        <button class="rbar-close" onclick="cancelReply()">✕</button>
      </div>
      <div class="input-row">
        <div class="input-pill">
          <button class="emoji-btn" onclick="toggleEmojiSheet()">😊</button>
          <textarea class="msg-input" id="msg-input" placeholder="Message..." rows="1" onkeydown="handleInputKey(event)" oninput="handleInputChange()"></textarea>
          <button class="attach-btn" onclick="showToast('File sharing coming soon! 🚧','')">📎</button>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- Context menu -->
    <div class="msg-ctx" id="msg-ctx">
      <div class="ctx-reacts">
        <button class="ctx-emoji" onclick="ctxReact('👍')">👍</button>
        <button class="ctx-emoji" onclick="ctxReact('❤️')">❤️</button>
        <button class="ctx-emoji" onclick="ctxReact('😂')">😂</button>
        <button class="ctx-emoji" onclick="ctxReact('🔥')">🔥</button>
        <button class="ctx-emoji" onclick="ctxReact('😮')">😮</button>
        <button class="ctx-emoji" onclick="ctxReact('😢')">😢</button>
      </div>
      <div class="ctx-item" onclick="ctxReply()"><span class="ctx-icon">↩️</span>Reply</div>
      <div class="ctx-item" onclick="ctxCopy()"><span class="ctx-icon">📋</span>Copy</div>
      <div class="ctx-item" id="ctx-edit" onclick="ctxEdit()" style="display:none;"><span class="ctx-icon">✏️</span>Edit</div>
      <div class="ctx-item" id="ctx-pin" onclick="ctxPin()"><span class="ctx-icon">📌</span>Pin</div>
      <div class="ctx-item danger" id="ctx-delete" onclick="ctxDelete()" style="display:none;"><span class="ctx-icon">🗑️</span>Delete</div>
    </div>
  </div>
</div>

<!-- Emoji Sheet -->
<div class="emoji-overlay" id="emoji-overlay" onclick="closeEmojiSheet()"></div>
<div class="emoji-sheet" id="emoji-sheet">
  <div class="esh-handle"></div>
  <input class="esh-search" id="esh-search" placeholder="Search emoji..." oninput="filterEmojis(this.value)"/>
  <div class="emoji-grid" id="emoji-grid"></div>
</div>

<!-- New Room Modal -->
<div class="modal-overlay" id="new-room-modal" onclick="if(event.target===this)closeNewRoomModal()">
  <div class="modal-sheet">
    <div class="msh-handle"></div>
    <div class="msh-title">New Channel 🔥</div>
    <div class="msh-body">
      <div class="pf-group"><label class="pf-label">Channel Name</label><input type="text" id="new-room-name" class="pf-input" placeholder="lowercase, no spaces" oninput="sanitizeRoomInput(this)" autocorrect="off" autocapitalize="off"/></div>
      <div class="pf-group"><label class="pf-label">Description (optional)</label><input type="text" id="new-room-desc" class="pf-input" placeholder="what's this about?"/></div>
    </div>
    <div class="msh-foot"><button class="btn-ghost" onclick="closeNewRoomModal()">Cancel</button><button class="btn-confirm" onclick="createRoom()">Create</button></div>
  </div>
</div>

<!-- Edit Message Modal -->
<div class="modal-center" id="edit-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="mbox">
    <div class="mbox-title">Edit Message ✏️</div>
    <textarea id="edit-input" class="mbox-input" rows="4" maxlength="2000"></textarea>
    <div class="mbox-foot"><button class="bsm-ghost" onclick="closeEditModal()">Cancel</button><button class="bsm-pri" onclick="submitEdit()">Save</button></div>
  </div>
</div>

<script>
const API='';
let WS_URL=(location.protocol==='https:'?'wss://':'ws://')+location.host;
let token=localStorage.getItem('vibe_token');
let currentUser=null,ws=null,wsRetry=0;

  buildEmojiGrid(ALL_EMOJIS);

// AUTH
function showAuthTab(t){
  document.getElementById('login-form').style.display=t==='login'?'':'none';
  document.getElementById('signup-form').style.display=t==='signup'?'':'none';
  document.querySelectorAll('.auth-tab').forEach((el,i)=>el.classList.toggle('active',(i===0)===(t==='login')));
  setAuthError('');
}
function setAuthError(m){const el=document.getElementById('auth-error');el.textContent=m;el.classList.toggle('show',!!m);}
async function doLogin(){
  const u=document.getElementById('login-username').value.trim(),p=document.getElementById('login-password').value;
  if(!u||!p)return setAuthError('Fill in both fields');
  const btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Logging in...';
  try{const d=await apiFetch('/api/login','POST',{username:u,password:p});token=d.token;currentUser=d.user;localStorage.setItem('vibe_token',token);setAuthError('');showChat();}
  catch(e){setAuthError(e.message||'Login failed');}
  finally{btn.disabled=false;btn.textContent='Let me in 🚀';}
}
async function doSignup(){
  const u=document.getElementById('signup-username').value.trim(),dn=document.getElementById('signup-displayname').value.trim(),p=document.getElementById('signup-password').value;
  if(!u||!p)return setAuthError('Username and password required');
  const btn=document.getElementById('signup-btn');btn.disabled=true;btn.textContent='Creating...';
  try{const d=await apiFetch('/api/signup','POST',{username:u,displayName:dn,password:p});token=d.token;currentUser=d.user;localStorage.setItem('vibe_token',token);setAuthError('');showChat();}
  catch(e){setAuthError(e.message||'Signup failed');}
  finally{btn.disabled=false;btn.textContent='Create Account →';}
}
function doLogout(){token=null;currentUser=null;localStorage.removeItem('vibe_token');if(ws){ws.close();ws=null;}showAuth();}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const as=document.getElementById('auth-screen');
  if(!as||as.style.display==='none')return;
  document.getElementById('login-form').style.display!=='none'?doLogin():doSignup();
});

function showAuth(){document.getElementById('auth-screen').style.display='';document.getElementById('chat-screen').classList.remove('active');}
async function showChat(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('chat-screen').classList.add('active');
  await Promise.all([loadRooms(),loadUsers()]);
  switchTab('chats');renderProfile();connectWS();
}

// TABS
function switchTab(t){
  activeTab=t;
  ['chats','channels','people','profile'].forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('active',s===t);
    document.getElementById('tab-'+s).classList.toggle('active',s===t);
  });
  if(t==='chats')renderChatsList();
  if(t==='channels')renderChannelsScreen();
  if(t==='people')filterPeople('');
  if(t==='profile')renderProfile();
}

// DATA
async function loadRooms(){rooms=await apiFetch('/api/rooms');}
async function loadUsers(){allUsers=await apiFetch('/api/users');}

// RENDER CHATS
function renderChatsList(){
  const list=document.getElementById('chats-list');if(!list)return;
  list.innerHTML='';
  // my story
  if(currentUser){const r=document.getElementById('my-story-ring');const a=document.getElementById('my-story-av');if(a){a.src=currentUser.avatar;a.alt=currentUser.displayName;}}
  // online user stories
  const sr=document.getElementById('stories-row');
  sr.querySelectorAll('.story-item:not(:first-child)').forEach(e=>e.remove());
  allUsers.filter(u=>u.id!==currentUser?.id&&onlineUserIds.has(u.id)).slice(0,8).forEach(u=>{
    const d=document.createElement('div');d.className='story-item';d.onclick=()=>openDM(u);
    d.innerHTML=`<div class="story-ring ${u.isOwner?'':''}"><img src="${esc(u.avatar)}" alt="${esc(u.displayName)}" loading="lazy"/></div><div class="story-name">${esc(u.displayName.split(' ')[0])}</div>`;
    sr.appendChild(d);
  });
  if(currentUser?.isOwner)document.getElementById('chats-title').innerHTML='<span class="owner-name">VIBE</span>';
  // channels
  if(rooms.length){
    list.insertAdjacentHTML('beforeend','<div class="list-section-header">Channels</div>');
    rooms.forEach(r=>{
      const div=document.createElement('div');div.className='chat-item';
      const unread=unreadCounts[r.id]||0;
      const icons={general:{cls:'ch-gen',e:'🔥'},random:{cls:'ch-ran',e:'🎲'},gaming:{cls:'ch-gam',e:'🎮'},music:{cls:'ch-mus',e:'🎵'}};
      const ic=icons[r.id]||{cls:'ch-def',e:'#'};
      div.innerHTML=`<div class="chat-item-av"><div class="ch-icon ${ic.cls}">${ic.e}</div></div><div class="chat-item-info"><div class="chat-item-top"><div class="chat-item-name">#${esc(r.name)}</div></div><div class="chat-item-preview ${unread?'unread':''}">${esc(r.description||'Tap to chat')}</div></div>${unread?`<div class="unread-pill">${unread>99?'99+':unread}</div>`:''}`;
      div.onclick=()=>openChannel(r);list.appendChild(div);
    });
  }
  // DMs
  const dms=allUsers.filter(u=>u.id!==currentUser?.id);
  if(dms.length){
    list.insertAdjacentHTML('beforeend','<div class="list-section-header">Direct Messages</div>');
    dms.forEach(u=>{
      const div=document.createElement('div');div.className='chat-item';
      const isOnline=onlineUserIds.has(u.id);const sc=isOnline?(u.status||'online'):'offline';
      const dmId='dm:'+u.id;const unread=unreadCounts[dmId]||0;
      div.innerHTML=`<div class="chat-item-av">${u.isOwner?'<div class="owner-av-border"></div>':''}<img src="${esc(u.avatar)}" alt="${esc(u.displayName)}" loading="lazy" style="position:relative;z-index:1;"/><span class="sdot ${sc}" style="bottom:1px;right:1px;width:12px;height:12px;position:absolute;"></span></div><div class="chat-item-info"><div class="chat-item-top"><div class="chat-item-name ${u.isOwner?'owner-name':''}">${esc(u.displayName)}${u.isOwner?' 👑':''}</div></div><div class="chat-item-preview ${unread?'unread':''}">@${esc(u.username)}${u.bio?' · '+esc(u.bio.slice(0,28)):''}</div></div>${unread?`<div class="unread-pill">${unread>99?'99+':unread}</div>`:''}`;
      div.onclick=()=>openDM(u);list.appendChild(div);
    });
  }
  // update tab badges
  const total=Object.values(unreadCounts).reduce((a,b)=>a+b,0);
  document.getElementById('badge-chats').style.display=total>0?'':'none';
}

function renderChannelsScreen(){

    const icons={general:{cls:'ch-gen',e:'🔥'},random:{cls:'ch-ran',e:'🎲'},gaming:{cls:'ch-gam',e:'🎮'},music:{cls:'ch-mus',e:'🎵'}};
    const ic=icons[r.id]||{cls:'ch-def',e:'#'};
    const unread=unreadCounts[r.id]||0;

function filterPeople(q){
  const list=document.getElementById('people-list');if(!list)return;
  list.innerHTML='';
  const filt=allUsers.filter(u=>u.id!==currentUser?.id&&(!q||(u.displayName+u.username).toLowerCase().includes(q.toLowerCase())));
  if(!filt.length){list.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">Nobody found</div></div>';return;}
  filt.sort((a,b)=>(onlineUserIds.has(b.id)?1:0)-(onlineUserIds.has(a.id)?1:0));
  const onC=filt.filter(u=>onlineUserIds.has(u.id)).length;
  list.insertAdjacentHTML('beforeend',`<div class="list-section-header">Online — ${onC}</div>`);
  filt.forEach(u=>{
    const isOnline=onlineUserIds.has(u.id);const sc=isOnline?(u.status||'online'):'offline';
    const se={online:'🟢',away:'🟡',dnd:'🔴',offline:'⚫'};
    const div=document.createElement('div');div.className='person-row';
    div.innerHTML=`<div class="person-av">${u.isOwner?'<div class="owner-av-border"></div>':''}<img src="${esc(u.avatar)}" alt="${esc(u.displayName)}" loading="lazy" style="position:relative;z-index:1;"/><span class="sdot ${sc}" style="bottom:0;right:0;width:11px;height:11px;position:absolute;"></span></div><div class="person-info"><div class="person-name ${u.isOwner?'owner-name':''}">${esc(u.displayName)}${u.isOwner?' 👑':''}</div><div class="person-user">@${esc(u.username)} ${se[sc]||'⚫'} ${sc}</div>${u.bio?`<div class="person-bio">${esc(u.bio)}</div>`:''}</div><button class="dm-btn" onclick="event.stopPropagation();openDM(allUsers.find(x=>x.id==='${u.id}'))">💬</button>`;
    list.appendChild(div);
  });
}

function selStatus(s,el){
  selectedStatus=s;

}
async function saveProfile(){
  const dn=document.getElementById('pf-dn')?.value.trim();
  const bio=document.getElementById('pf-bio')?.value.trim();
  const status=selectedStatus||currentUser.status;
  if(!dn)return showToast('Display name required','error');
  try{
    await Promise.all([apiFetch('/api/users/displayName','PATCH',{displayName:dn}),apiFetch('/api/users/bio','PATCH',{bio}),apiFetch('/api/users/status','PATCH',{status})]);
    currentUser.displayName=dn;currentUser.bio=bio;currentUser.status=status;
    selectedStatus=null;renderProfile();await loadUsers();renderChatsList();showToast('Saved ✨','success');
  }catch(e){showToast(e.message||'Failed','error');}
}

// OPEN CHANNEL / DM
function openChannel(room){
  currentRoom={type:'channel',id:room.id,name:room.name,desc:room.description||''};
  delete unreadCounts[room.id];cancelReply();
  document.getElementById('cv-name').innerHTML=`#${esc(room.name)}`;
  document.getElementById('cv-sub').textContent=room.description||'Channel';
  document.getElementById('cv-av').style.display='none';
  openChatView();loadMessages();
}
function openDM(user){
  if(!user)return;
  currentRoom={type:'dm',id:'dm:'+user.id,toUserId:user.id,name:user.displayName,desc:'@'+user.username};
  delete unreadCounts['dm:'+user.id];cancelReply();
  const se={online:'🟢',away:'🟡',dnd:'🔴',offline:'⚫'};
  const isOnline=onlineUserIds.has(user.id);
  document.getElementById('cv-name').innerHTML=user.isOwner?`<span class="owner-name">${esc(user.displayName)}</span>`:esc(user.displayName);
  document.getElementById('cv-sub').innerHTML=`${se[isOnline?user.status:'offline']||'⚫'} ${isOnline?(user.status||'online'):'offline'}`;
  const av=document.getElementById('cv-av');av.src=user.avatar;av.style.display='';
  openChatView();loadMessages();renderChatsList();
}
function openChatView(){
  const cv=document.getElementById('screen-chat-view');cv.classList.add('open');
  document.getElementById('messages-area').innerHTML='';
  typingUsers={};renderTyping();
  document.getElementById('pinned-bar').style.display='none';
  document.getElementById('search-panel').classList.remove('visible');
  setTimeout(()=>document.getElementById('msg-input').focus(),300);
}
function closeChatView(){
  document.getElementById('screen-chat-view').classList.remove('open');
  currentRoom=null;cancelReply();renderChatsList();renderChannelsScreen();
}

// MESSAGES
async function loadMessages(){
  document.getElementById('messages-area').innerHTML='';
  try{
    const msgs=currentRoom.type==='channel'?await apiFetch(`/api/messages/${currentRoom.id}`):await apiFetch(`/api/dm/${currentRoom.toUserId}`);
    msgs.forEach(m=>appendMessage(m,false));scrollToBottom(true);
  }catch{showToast('Failed to load','error');}
}
function appendMessage(msg,animate=true){
  const area=document.getElementById('messages-area');if(!area)return;
  const u=msg.user||{};const isMine=u.id===currentUser?.id;const isOwner=u.isOwner;
  const time=formatTime(msg.createdAt);
  // day sep
  const td=new Date(msg.createdAt).toDateString();
  const lastSep=area.querySelector('.day-sep:last-of-type');
  if(!lastSep||lastSep.dataset.d!==td){const sep=document.createElement('div');sep.className='day-sep';sep.dataset.d=td;sep.innerHTML=`<span>${td===new Date().toDateString()?'Today':new Date(msg.createdAt).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}</span>`;area.appendChild(sep);}
  // grouping
  const last=area.querySelector('[data-mid]:last-of-type');
  const isCont=last?.dataset.uid===u.id&&(msg.createdAt-parseInt(last.dataset.t||0))<5*60*1000&&!msg.replyTo;
  // reactions
  const reacts=msg.reactions||{};
  const reactsHtml=Object.entries(reacts).filter(([,us])=>us.length).map(([e,us])=>`<span class="rpill ${us.includes(currentUser?.id)?'mine':''}" onclick="addReaction('${msg.id}','${e}')">${e}<span class="rcount">${us.length}</span></span>`).join('');
  // reply
  let replyHtml='';
  if(msg.replyToMsg){const ru=msg.replyToMsg.user;replyHtml=`<div class="breply" onclick="scrollToMsg('${msg.replyTo}')"><div class="breply-name">${esc(ru?.displayName||'User')}</div><div class="breply-text">${esc((msg.replyToMsg.text||'').slice(0,60))}</div></div>`;}
  const wrap=document.createElement('div');
  wrap.className=`msg-wrap ${isMine?'mine':''} ${isCont?'cont':''}`;
  wrap.dataset.mid=msg.id;wrap.dataset.uid=u.id||'';wrap.dataset.t=msg.createdAt;
  const avHtml=`<div class="bav">${isOwner?'<div class="owner-av-border"></div>':''}<img src="${esc(u.avatar||'')}" alt="${esc(u.displayName||'?')}" loading="lazy"/></div>`;
  const nameHtml=(!isCont&&!isMine)?`<div class="bname ${isOwner?'owner-name':''}">${esc(u.displayName||u.username||'?')}${isOwner?' 👑':''}</div>`:'';
  wrap.innerHTML=`${!isMine?avHtml:''}
    <div class="bcol">
      ${nameHtml}
      <div class="bubble ${isCont?'cont':''}" id="b-${msg.id}">${replyHtml}<div id="bt-${msg.id}">${renderMsgText(msg.text||'')}</div></div>
      <div class="bmeta"><span class="btime">${time}</span>${msg.edited?'<span class="bedited">edited</span>':''}</div>
      <div class="breacts" id="br-${msg.id}">${reactsHtml}</div>
    </div>
    ${isMine?avHtml:''}`;
  // long press
  const bubble=wrap.querySelector('.bubble');
  let pt;
  bubble.addEventListener('touchstart',e=>{pt=setTimeout(()=>showCtx(e,msg.id,u.id,isMine),500);},{passive:true});
  bubble.addEventListener('touchend',()=>clearTimeout(pt));
  bubble.addEventListener('touchmove',()=>clearTimeout(pt));
  bubble.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e,msg.id,u.id,isMine);});
  area.appendChild(wrap);
  if(animate){wrap.style.opacity='0';wrap.style.transform='translateY(5px)';requestAnimationFrame(()=>{wrap.style.transition='opacity 0.18s,transform 0.18s';wrap.style.opacity='1';wrap.style.transform='';});}
}
function renderMsgText(t){
  t=t.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre>${esc(c.trim())}</pre>`);
  t=t.replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`);
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/(https?:\/\/[^\s<>"]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  return t;
}
function updateReactions(mid,reacts){const el=document.getElementById('br-'+mid);if(!el)return;el.innerHTML=Object.entries(reacts).filter(([,us])=>us.length).map(([e,us])=>`<span class="rpill ${us.includes(currentUser?.id)?'mine':''}" onclick="addReaction('${mid}','${e}')">${e}<span class="rcount">${us.length}</span></span>`).join('');}
function scrollToMsg(mid){const el=document.querySelector(`[data-mid="${mid}"]`);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});const b=el.querySelector('.bubble');if(b){b.style.background='rgba(255,107,53,0.2)';setTimeout(()=>{b.style.background='';},1500);}}
function scrollToBottom(instant=false){const a=document.getElementById('messages-area');if(!a)return;instant?a.scrollTop=a.scrollHeight:a.scrollTo({top:a.scrollHeight,behavior:'smooth'});}
function isNearBottom(){const a=document.getElementById('messages-area');if(!a)return true;return a.scrollHeight-a.scrollTop-a.clientHeight<120;}
window.addEventListener('load',()=>{const a=document.getElementById('messages-area'),btn=document.getElementById('scroll-btn');if(a&&btn)a.addEventListener('scroll',()=>btn.classList.toggle('visible',!isNearBottom()));});

// CONTEXT MENU
function showCtx(e,mid,uid,isMine){
  const ctx=document.getElementById('msg-ctx');ctxMsgId=mid;
  document.getElementById('ctx-edit').style.display=isMine?'':'none';
  document.getElementById('ctx-delete').style.display=(isMine||currentUser?.isOwner)?'':'none';
  ctx.classList.add('show');
  const x=e.clientX||(e.touches?.[0]?.clientX||window.innerWidth/2);
  const y=e.clientY||(e.touches?.[0]?.clientY||window.innerHeight/2);
  ctx.style.left=Math.min(x,window.innerWidth-170)+'px';
  ctx.style.top=Math.min(y,window.innerHeight-230)+'px';
}
function closeCtx(){document.getElementById('msg-ctx').classList.remove('show');ctxMsgId=null;}
function ctxReact(e){if(ctxMsgId)addReaction(ctxMsgId,e);closeCtx();}
function ctxReply(){if(ctxMsgId)setReply(ctxMsgId);closeCtx();}
function ctxCopy(){if(!ctxMsgId)return;const el=document.getElementById('bt-'+ctxMsgId);if(el)navigator.clipboard?.writeText(el.textContent).then(()=>showToast('Copied!','success'));closeCtx();}
function ctxEdit(){if(ctxMsgId)openEditModal(ctxMsgId);closeCtx();}
function ctxPin(){if(ctxMsgId)togglePin(ctxMsgId);closeCtx();}
function ctxDelete(){if(ctxMsgId)deleteMessage(ctxMsgId);closeCtx();}
document.addEventListener('click',e=>{const c=document.getElementById('msg-ctx');if(c?.classList.contains('show')&&!c.contains(e.target))closeCtx();});

// SEND
function sendMessage(){
  const input=document.getElementById('msg-input');const text=input.value.trim();
  if(!text||!currentRoom||!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify(currentRoom.type==='channel'?{type:'message',roomId:currentRoom.id,text,replyTo:replyingTo?.id||null}:{type:'dm',toUserId:currentRoom.toUserId,text,replyTo:replyingTo?.id||null}));
  input.value='';autoResize(input);cancelReply();stopTyping();
}
function handleInputKey(e){if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>600){e.preventDefault();sendMessage();}if(e.key==='Escape'){cancelReply();closeEmojiSheet();}}
function handleInputChange(){autoResize(document.getElementById('msg-input'));sendTyping();}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

// REPLY
function setReply(mid){
  const wrap=document.querySelector(`[data-mid="${mid}"]`);if(!wrap)return;
  const uid=wrap.dataset.uid;const user=allUsers.find(u=>u.id===uid)||{};
  const text=(document.getElementById('bt-'+mid)?.textContent||'').slice(0,60);
  replyingTo={id:mid,uid,text,username:user.displayName||user.username||'User'};
  document.getElementById('rbar-name').textContent=replyingTo.username;
  document.getElementById('rbar-text').textContent=text+(text.length>=60?'...':'');
  document.getElementById('reply-bar').style.display='flex';
  document.getElementById('msg-input').focus();
}
function cancelReply(){replyingTo=null;const rb=document.getElementById('reply-bar');if(rb)rb.style.display='none';}

// EDIT / DELETE
function openEditModal(mid){const el=document.getElementById('bt-'+mid);if(!el)return;editingMsgId=mid;document.getElementById('edit-input').value=el.textContent;document.getElementById('edit-modal').classList.add('show');}
function closeEditModal(){editingMsgId=null;document.getElementById('edit-modal').classList.remove('show');}
function submitEdit(){if(!editingMsgId||!ws||ws.readyState!==1)return;const t=document.getElementById('edit-input').value.trim();if(!t)return;ws.send(JSON.stringify({type:'edit_message',messageId:editingMsgId,text:t}));closeEditModal();}
function deleteMessage(mid){if(!ws||ws.readyState!==1||!confirm('Delete?'))return;ws.send(JSON.stringify({type:'delete_message',messageId:mid}));}

// PIN
function togglePin(mid){apiFetch(`/api/messages/${mid}/pin`,'POST').then(d=>showToast(d.pinned?'📌 Pinned!':'Unpinned','success')).catch(()=>showToast('Failed','error'));}
async function loadPins(){
  if(!currentRoom||currentRoom.type!=='channel'){showToast('Pins only in channels','');return;}
  try{const pins=await apiFetch(`/api/rooms/${currentRoom.id}/pins`);if(!pins.length){showToast('No pins yet','');return;}const l=pins[pins.length-1];document.getElementById('pb-text').textContent=`${l.user?.displayName||'User'}: ${l.text.slice(0,70)}`;document.getElementById('pinned-bar').style.display='flex';}
  catch{showToast('Could not load pins','error');}
}

// SEARCH
function toggleSearch(){const sp=document.getElementById('search-panel');const v=sp.classList.toggle('visible');if(v)document.getElementById('search-input').focus();else document.getElementById('search-results').innerHTML='';}
function doSearch(){
  clearTimeout(searchDebounce);const q=document.getElementById('search-input').value.trim();const re=document.getElementById('search-results');
  if(q.length<2){re.innerHTML='';return;}
  searchDebounce=setTimeout(async()=>{
    try{const rid=currentRoom?.type==='channel'?currentRoom.id:'';const results=await apiFetch(`/api/search?q=${encodeURIComponent(q)}${rid?'&roomId='+rid:''}`);
    if(!results.length){re.innerHTML='<div style="padding:8px 12px;color:var(--text3);font-size:12px;">No results</div>';return;}
    re.innerHTML=results.map(m=>`<div class="sresult" onclick="scrollToMsg('${m.id}');toggleSearch()"><div class="sresult-meta">${esc(m.user?.displayName||'User')} · ${formatTime(m.createdAt)}</div><div class="sresult-text">${esc(m.text).replace(new RegExp(esc(q),'gi'),x=>`<mark>${x}</mark>`)}</div></div>`).join('');}
    catch{re.innerHTML='<div style="padding:8px 12px;color:var(--text3);">Search failed</div>';}
  },350);
}

// TYPING
function sendTyping(){if(!ws||ws.readyState!==1||!currentRoom)return;if(!isTyping){isTyping=true;ws.send(JSON.stringify(currentRoom.type==='channel'?{type:'typing',roomId:currentRoom.id}:{type:'typing',isDm:true,toUserId:currentRoom.toUserId}));}clearTimeout(typingTimeout);typingTimeout=setTimeout(stopTyping,3000);}
function stopTyping(){isTyping=false;clearTimeout(typingTimeout);}
function renderTyping(){
  const el=document.getElementById('typing-row');if(!el||!currentRoom){if(el)el.innerHTML='';return;}
  const key=currentRoom.type==='channel'?currentRoom.id:'dm:'+currentRoom.toUserId;
  const uids=Object.keys(typingUsers[key]||{});
  if(!uids.length){el.innerHTML='';return;}
  const names=uids.map(id=>allUsers.find(x=>x.id===id)?.displayName||'Someone');
  const txt=names.length===1?`${names[0]} is typing`:names.length===2?`${names[0]} and ${names[1]} are typing`:`${names[0]} and ${names.length-1} others`;
  el.innerHTML=`<div class="typing-bub"><div class="tdots"><span></span><span></span><span></span></div></div><span class="tname">${esc(txt)}</span>`;
}

// REACTIONS
function addReaction(mid,e){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'reaction',messageId:mid,emoji:e}));}

// EMOJI SHEET
function buildEmojiGrid(emojis){const g=document.getElementById('emoji-grid');if(!g)return;g.innerHTML='';emojis.forEach(e=>{const b=document.createElement('button');b.className='egrid-btn';b.textContent=e;b.onclick=()=>insertEmoji(e);g.appendChild(b);});}
function filterEmojis(q){buildEmojiGrid(q?ALL_EMOJIS.filter(e=>e.includes(q)):ALL_EMOJIS);}
function toggleEmojiSheet(){const s=document.getElementById('emoji-sheet'),o=document.getElementById('emoji-overlay');const open=s.classList.toggle('open');o.classList.toggle('open',open);if(open){const es=document.getElementById('esh-search');if(es){es.value='';buildEmojiGrid(ALL_EMOJIS);}}}
function closeEmojiSheet(){document.getElementById('emoji-sheet').classList.remove('open');document.getElementById('emoji-overlay').classList.remove('open');}
function insertEmoji(e){const i=document.getElementById('msg-input');const s=i.selectionStart,end=i.selectionEnd;i.value=i.value.slice(0,s)+e+i.value.slice(end);i.selectionStart=i.selectionEnd=s+e.length;i.focus();autoResize(i);closeEmojiSheet();}

// ROOM CRUD
function openNewRoomModal(){document.getElementById('new-room-modal').classList.add('show');setTimeout(()=>document.getElementById('new-room-name').focus(),200);}
function closeNewRoomModal(){document.getElementById('new-room-modal').classList.remove('show');document.getElementById('new-room-name').value='';document.getElementById('new-room-desc').value='';}
function sanitizeRoomInput(el){el.value=el.value.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-');}
async function createRoom(){
  const name=document.getElementById('new-room-name').value.trim(),desc=document.getElementById('new-room-desc').value.trim();
  if(!name)return showToast('Channel name required','error');
  try{await apiFetch('/api/rooms','POST',{name,description:desc});await loadRooms();closeNewRoomModal();renderChatsList();renderChannelsScreen();showToast(`#${name} created 🎉`,'success');}
  catch(e){showToast(e.message,'error');}
}
async function deleteRoom(id){
  if(!confirm('Delete this channel?'))return;
  try{await apiFetch(`/api/rooms/${id}`,'DELETE');await loadRooms();renderChannelsScreen();renderChatsList();showToast('Deleted','success');}
  catch(e){showToast(e.message,'error');}
}

// WEBSOCKET
function connectWS(){
  if(ws){try{ws.close();}catch{}}
  ws=new WebSocket(WS_URL);setWsDot('reconnecting');
  ws.onopen=()=>{wsRetry=0;setWsDot('connected');ws.send(JSON.stringify({type:'auth',token}));};
  ws.onclose=()=>{setWsDot('disconnected');const d=Math.min(1000*Math.pow(1.5,wsRetry),30000);wsRetry++;setTimeout(()=>{if(token)connectWS();},d);};
  ws.onerror=()=>setWsDot('disconnected');
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch{return;}handleWS(d);};
}
function setWsDot(s){const el=document.getElementById('ws-dot');if(!el)return;el.className='ws-dot'+(s==='connected'?' connected':s==='reconnecting'?' reconnecting':'');}
function handleWS(data){
  switch(data.type){
    case 'online_users':onlineUserIds=new Set(data.userIds);renderChatsList();filterPeople(document.getElementById('people-search')?.value||'');break;
    case 'user_online':onlineUserIds.add(data.userId);{const u=allUsers.find(x=>x.id===data.userId);if(u)u.status='online';}renderChatsList();break;
    case 'user_offline':onlineUserIds.delete(data.userId);{const u=allUsers.find(x=>x.id===data.userId);if(u)u.status='offline';}renderChatsList();break;
    case 'message':{const m=data.message;const ic=currentRoom?.type==='channel'&&currentRoom.id===m.roomId;if(ic){const wb=isNearBottom();appendMessage(m);if(wb||m.userId===currentUser?.id)scrollToBottom();}else{unreadCounts[m.roomId]=(unreadCounts[m.roomId]||0)+1;renderChatsList();renderChannelsScreen();if(m.userId!==currentUser?.id)showToast(`#${m.roomId}: ${esc(m.user?.displayName)}: ${m.text.slice(0,40)}`);}break;}
    case 'dm':{const m=data.message;const oid=m.userId===currentUser?.id?m.toUserId:m.userId;const ic=currentRoom?.type==='dm'&&currentRoom.toUserId===oid;if(ic){const wb=isNearBottom();appendMessage(m);if(wb||m.userId===currentUser?.id)scrollToBottom();}else if(m.userId!==currentUser?.id){const dmId='dm:'+oid;unreadCounts[dmId]=(unreadCounts[dmId]||0)+1;renderChatsList();const fn=data.fromUser?.displayName||allUsers.find(u=>u.id===m.userId)?.displayName||'someone';showToast(`💬 ${esc(fn)}: ${m.text.slice(0,40)}`);}break;}
    case 'message_edited':{const el=document.getElementById('bt-'+data.messageId);if(el)el.innerHTML=renderMsgText(data.text);const w=document.querySelector(`[data-mid="${data.messageId}"]`);if(w){const bm=w.querySelector('.bmeta');if(bm&&!bm.querySelector('.bedited')){const ed=document.createElement('span');ed.className='bedited';ed.textContent='edited';bm.appendChild(ed);}}break;}
    case 'message_deleted':{const el=document.querySelector(`[data-mid="${data.messageId}"]`);if(el){el.style.transition='opacity 0.2s,transform 0.2s';el.style.opacity='0';el.style.transform='scale(0.9)';setTimeout(()=>el.remove(),200);}break;}
    case 'typing':{if(data.userId===currentUser?.id)break;const key=data.isDm?`dm:${data.toUserId===currentUser?.id?data.userId:data.toUserId}`:data.roomId;if(!typingUsers[key])typingUsers[key]={};if(typingUsers[key][data.userId])clearTimeout(typingUsers[key][data.userId]);typingUsers[key][data.userId]=setTimeout(()=>{delete typingUsers[key][data.userId];renderTyping();},3500);renderTyping();break;}
    case 'reaction_update':updateReactions(data.messageId,data.reactions);break;
    case 'room_created':if(!rooms.find(r=>r.id===data.room.id)){rooms.push(data.room);renderChatsList();renderChannelsScreen();}break;
    case 'room_deleted':rooms=rooms.filter(r=>r.id!==data.roomId);if(currentRoom?.id===data.roomId)closeChatView();renderChannelsScreen();renderChatsList();break;
    case 'error':showToast(data.message,'error');break;
  }
}

// TOAST
function showToast(msg,type=''){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},3000);}

// UTILS
async function apiFetch(path,method='GET',body=null){const opts={method,headers:{'Content-Type':'application/json'}};if(token)opts.headers['Authorization']='Bearer '+token;if(body)opts.body=JSON.stringify(body);let res;try{res=await fetch(API+path,opts);}catch{throw new Error('Network error');}const ct=res.headers.get('content-type')||'';let data;if(ct.includes('application/json')){try{data=await res.json();}catch{data={};}}else{const txt=await res.text().catch(()=>'');if(!res.ok)throw new Error(`Server error ${res.status}`);return txt;}if(!res.ok)throw new Error(data.error||`Failed (${res.status})`);return data;}
function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatTime(ts){const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const y=new Date();y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return 'Yesterday '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([],{month:'short',day:'numeric'});}
document.addEventListener('touchmove',e=>{if(e.target.closest('.messages-area,.chats-list,.people-list,.profile-scroll,.stories-row,.emoji-grid,.search-results'))return;e.preventDefault();},{passive:false});
</script>
